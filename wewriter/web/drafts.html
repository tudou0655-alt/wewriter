<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>/* Theme before first paint, so a forced light/dark choice never flashes the other one. */
try { var t = sessionStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
<style>
/* Page changes cross-fade instead of blanking; the sidebar is matched so it stays put. */
@view-transition { navigation: auto; }
.rail { view-transition-name: rail; }
::view-transition-old(root), ::view-transition-new(root) { animation-duration: .16s; }
::view-transition-group(rail) { animation-duration: 0s; }
@media (prefers-reduced-motion: reduce) { ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; } }
</style>
<title>WeWriter 稿件库</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: list view and a manuscript view in the same column; the manuscript reads like a printed page. */
:root {
  --ground: #f1ebde; --sheet: #faf6ec; --ink: #2a2620; --ink-2: #6b6355; --rule: #e3d9c5;
  --jade: #0d6b5b; --jade-soft: #e4ecdf; --cinnabar: #b9452f; --cinnabar-soft: #f8e6e1;
  --amber: #8a5a12; --amber-soft: #f7efdc; --focus: #1f7a68; --glint: #8fe6d1; --field: #fbfcfc;
  --font-display: "Noto Serif SC", "Songti SC", "SimSun", serif;
  --font-body: "Noto Sans SC", "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0e1416; --sheet: #162024; --ink: #e6eeeb; --ink-2: #9cb0ab; --rule: #2a3a3e;
    --jade: #63c6ae; --jade-soft: #173a33; --cinnabar: #f08c74; --cinnabar-soft: #3d2520;
    --amber: #e8c27a; --amber-soft: #3a3020; --focus: #63c6ae; --glint: #e6fff8; --field: #11191c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #0e1416; --sheet: #162024; --ink: #e6eeeb; --ink-2: #9cb0ab; --rule: #2a3a3e;
  --jade: #63c6ae; --jade-soft: #173a33; --cinnabar: #f08c74; --cinnabar-soft: #3d2520;
  --amber: #e8c27a; --amber-soft: #3a3020; --focus: #63c6ae; --glint: #e6fff8; --field: #11191c; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--ground); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.6; }
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.app { display: grid; grid-template-columns: 196px minmax(0, 1fr); min-height: 100%; }
.rail { background: var(--sheet); border-right: 1px solid var(--rule); padding-block: 22px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; display: flex; flex-direction: column; gap: 28px; }
.brand { display: flex; flex-direction: column; gap: 2px; padding-left: 10px; }
.brand b { font-family: var(--font-display); font-size: 22px; letter-spacing: .02em; }
.brand span { color: var(--ink-2); font-size: 12px; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav button { all: unset; cursor: pointer; padding: 9px 12px; border-radius: 8px; color: var(--ink-2); display: flex; justify-content: space-between; align-items: center; }
.nav button:hover { background: var(--ground); color: var(--ink); }
.nav button[aria-current="page"] { background: var(--jade-soft); color: var(--jade); font-weight: 700; }
.nav small { font-size: 11px; color: var(--ink-2); font-weight: 400; }
.rail .foot { margin-top: auto; padding-left: 10px; color: var(--ink-2); font-size: 12px; }
main { padding-block: 28px 48px; padding-inline: clamp(16px, 3vw, 48px); min-width: 0; }
.wrap { max-width: 1560px; margin-inline: auto; display: grid; gap: 16px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
h1 { font-family: var(--font-display); font-size: 30px; margin: 0; letter-spacing: .02em; }
.sample { font-size: 12px; color: var(--amber); background: var(--amber-soft); padding: 2px 8px; border-radius: 999px; }
.note { color: var(--ink-2); font-size: 13px; }
.panel { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius); padding: 6px 22px; min-width: 0; }
.btn { cursor: pointer; border: 1px solid var(--rule); background: var(--sheet); border-radius: 8px; padding: 7px 14px; white-space: nowrap; }
.btn:hover { border-color: var(--ink-2); }
.btn:disabled { cursor: not-allowed; opacity: .5; }
.btn.primary { background: var(--jade); border-color: var(--jade); color: var(--sheet); font-weight: 700; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.quiet { border-color: transparent; color: var(--ink-2); }
.btn.quiet:hover { color: var(--ink); border-color: var(--rule); }
.btn.warn { color: var(--amber); }
.input, .select { border: 1px solid var(--rule); background: var(--sheet); border-radius: 8px; padding: 8px 12px; width: 100%; }
.select { padding-right: 30px; appearance: none; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-2) 50%), linear-gradient(135deg, var(--ink-2) 50%, transparent 50%);
  background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
.input:focus, .select:focus, textarea:focus { border-color: var(--jade); outline: none; box-shadow: 0 0 0 3px var(--jade-soft); }

/* List */
.filters { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; }
.tabs { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; background: var(--sheet); }
.tabs button { all: unset; cursor: pointer; padding: 7px 14px; color: var(--ink-2); border-right: 1px solid var(--rule); font-variant-numeric: tabular-nums; }
.tabs button:last-child { border-right: 0; }
.tabs button[aria-pressed="true"] { background: var(--jade-soft); color: var(--jade); font-weight: 700; }
.meta-row { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--ink-2); font-size: 12px; }
.list { list-style: none; margin: 0; padding: 0; }
.list li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: center; padding: 14px 0; border-top: 1px solid var(--rule); }
.list li:first-child { border-top: 0; }
.list .t { font-weight: 500; font-size: 15px; overflow-wrap: anywhere; }
.list .m { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin-top: 3px; font-variant-numeric: tabular-nums; }
.s-wait { color: var(--cinnabar); }
.s-fix { color: var(--amber); }
.s-ok { color: var(--jade); }
.flag { color: var(--amber); }
.empty { color: var(--ink-2); font-size: 13px; padding: 22px 0; text-align: center; }
.pager { display: flex; justify-content: space-between; align-items: center; color: var(--ink-2); font-size: 12px; font-variant-numeric: tabular-nums; }
.pager div { display: flex; gap: 8px; }

/* Manuscript */
.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.pill { font-size: 12px; padding: 3px 10px; border-radius: 999px; font-weight: 700; }
.pill.wait { background: var(--cinnabar-soft); color: var(--cinnabar); }
.pill.fix { background: var(--amber-soft); color: var(--amber); }
.pill.ok { background: var(--jade-soft); color: var(--jade); }
.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius); padding: 34px clamp(20px, 3.5vw, 64px) 26px; min-width: 0; }
.sheet h2 { font-family: var(--font-display); font-size: 26px; line-height: 1.4; margin: 0 0 8px; text-wrap: balance; }
.byline { color: var(--ink-2); font-size: 13px; font-variant-numeric: tabular-nums; display: flex; gap: 14px; flex-wrap: wrap; }
.warnline { margin-top: 14px; background: var(--amber-soft); color: var(--amber); border-radius: 8px; padding: 9px 12px; font-size: 13px; }
.okline { margin-top: 14px; background: var(--jade-soft); color: var(--jade); border-radius: 8px; padding: 9px 12px; font-size: 13px; }
/* Reading width grows with the window (about 38em on a laptop, up to 64em full screen). */
.prose { margin-top: 22px; font-size: clamp(15.5px, 9px + .45vw, 17.5px); line-height: 1.95; max-width: min(100%, 64em); }
.prose ul, .prose ol { margin: 0 0 1.1em; padding-left: 1.6em; }
.prose li { margin: .25em 0; }
.prose table { border-collapse: collapse; margin: 0 0 1.2em; width: 100%; font-size: .92em; line-height: 1.6; }
.prose th, .prose td { border: 1px solid var(--rule); padding: 6px 10px; text-align: left; vertical-align: top; }
.prose th { background: var(--ground); font-weight: 600; }
.prose p { margin: 0 0 1.1em; }
.prose h3 { font-family: var(--font-display); font-size: 18px; margin: 1.6em 0 .6em; }
.prose blockquote { margin: 0 0 1.1em; padding: 2px 0 2px 14px; border-left: 3px solid var(--rule); color: var(--ink-2); }
.cite { font-size: 11px; vertical-align: super; color: var(--jade); margin-left: 1px; cursor: help; }
.edit-title { font-family: var(--font-display); font-size: 24px; font-weight: 700; width: 100%; border: 1px solid var(--rule); border-radius: 8px; padding: 8px 12px; background: var(--field); }
textarea.edit-body { width: 100%; min-height: 420px; margin-top: 14px; border: 1px solid var(--rule); border-radius: 8px; padding: 14px 16px; background: var(--field); font-size: 15px; line-height: 1.9; resize: vertical; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--rule); align-items: center; }
.actions .grow { flex: 1; }
.inline { margin-top: 14px; border-radius: 8px; padding: 14px; display: grid; gap: 10px; font-size: 13px; }
.inline.ok { background: var(--jade-soft); }
.inline.fix { background: var(--amber-soft); }
.inline.warn { background: var(--cinnabar-soft); color: var(--cinnabar); }
.inline .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.inline textarea { border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; background: var(--sheet); min-height: 64px; resize: vertical; }
.export { display: grid; gap: 12px; }
.formats { display: flex; gap: 8px; flex-wrap: wrap; }
.formats label { display: flex; gap: 8px; align-items: center; border: 1px solid var(--rule); border-radius: 8px; padding: 8px 12px; cursor: pointer; background: var(--sheet); }
.formats input { accent-color: var(--jade); }
.formats label:has(input:checked) { border-color: var(--jade); color: var(--jade); font-weight: 700; }
details.more { margin-top: 18px; border-top: 1px solid var(--rule); padding-top: 12px; }
details.more summary { cursor: pointer; color: var(--ink-2); font-size: 13px; }
.src { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 6px; font-size: 13px; }
.src li { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 10px; }
.src b { color: var(--jade); font-weight: 700; }
.src span small { color: var(--ink-2); display: block; }
.log { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 6px; font-size: 13px; font-variant-numeric: tabular-nums; }
.log li { display: grid; grid-template-columns: 10em 6em minmax(0, 1fr); gap: 10px; }
.log .who { color: var(--ink-2); }
h5 { font-size: 13px; margin: 16px 0 0; font-weight: 700; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--sheet); padding: 8px 16px; border-radius: 8px; font-size: 13px; z-index: 30; max-width: calc(100% - 32px); }
.guard { position: fixed; inset: 0; background: rgb(0 0 0 / .35); display: grid; place-items: center; z-index: 40; padding: 16px; }
.guard > div { background: var(--sheet); border-radius: var(--radius); padding: 20px 22px; max-width: 420px; display: grid; gap: 14px; }
.guard .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { flex-direction: row; align-items: center; padding-block: 10px; border-right: 0; border-bottom: 1px solid var(--rule); gap: 14px; overflow-x: auto; }
  .brand span, .rail .foot, .nav small { display: none; }
  .nav { flex-direction: row; }
  main { padding-left: max(16px, env(safe-area-inset-left, 0px)); }
  .filters { grid-template-columns: minmax(0, 1fr); }
  .tabs { overflow-x: auto; }
  .list li { grid-template-columns: minmax(0, 1fr); }
  .sheet { padding: 22px 18px; }
  .log li { grid-template-columns: minmax(0, 1fr); gap: 0; }
}
</style>

<div class="app">
  <aside class="rail">
    <div class="brand"><b>WeWriter</b><span>公众号内容工作台</span></div>
    <nav class="nav" aria-label="页面" id="nav"></nav>
    <div class="foot" id="foot"></div>
  </aside>

  <main>
    <!-- List view -->
    <div class="wrap" id="v-list">
      <div class="top"><h1>稿件库</h1></div>
      <div class="filters">
        <input class="input" id="q" type="search" placeholder="搜索稿件标题或正文" aria-label="搜索稿件">
        <div class="tabs" role="group" aria-label="按审核状态筛选" id="tabs"></div>
      </div>
      <div class="meta-row"><span id="total"></span><span>最新生成的在前 · 只有“已通过”计入合格稿件</span></div>
      <section class="panel" aria-label="稿件列表"><ul class="list" id="list"></ul></section>
      <div class="pager" id="pager"><span id="pageinfo"></span><div><button class="btn" id="prev">上一页</button><button class="btn" id="next">下一页</button></div></div>
    </div>

    <!-- Manuscript view -->
    <div class="wrap" id="v-draft" hidden>
      <div class="bar">
        <button class="btn" id="back">← 返回稿件库</button>
        <span class="pill" id="pill"></span>
      </div>
      <article class="sheet" id="sheet"></article>
    </div>
  </main>
</div>
<div class="guard" id="guard" hidden role="dialog" aria-modal="true" aria-labelledby="guard-t">
  <div><b id="guard-t">有未保存的修改</b><span class="note">离开后，这次编辑的内容会丢失。</span>
    <div class="row"><button class="btn quiet" id="guard-stay">继续编辑</button><button class="btn warn" id="guard-leave">放弃修改并离开</button></div></div>
</div>
<div class="toast" id="toast" hidden></div>
<script src="common.js"></script>
<script src="drafts.js"></script>
</html>
