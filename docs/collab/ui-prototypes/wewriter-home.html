<div id="ww-home">
<style>
#ww-home{--paper:light-dark(#ffffff,#20252d);--base:light-dark(#f4f6f8,#14181f);--ink:light-dark(#172638,#eef2f7);--muted:light-dark(#627183,#aab6c6);--line:light-dark(#dfe5ec,#38414d);--accent:light-dark(#225ac3,#98baff);--tint:light-dark(#edf3ff,#243859);--good:light-dark(#206c53,#8dd3b7);--warn:light-dark(#8a5b16,#edc788);color:var(--ink);font:14px/1.55 'Microsoft YaHei',sans-serif;background:var(--base);border-radius:14px;overflow:hidden;color-scheme:light dark}
#ww-home *{box-sizing:border-box}#ww-home button,#ww-home select{font:inherit;color:inherit;cursor:pointer}#ww-home button{border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:7px 12px}#ww-home button:hover{border-color:var(--accent)}#ww-home button.primary{background:var(--accent);color:light-dark(#fff,#14243f);border-color:var(--accent)}#ww-home button:disabled{opacity:.5;cursor:default}#ww-home .top{background:var(--paper);border-bottom:1px solid var(--line);padding:14px 22px;display:flex;gap:14px;align-items:center;padding-right:100px}#ww-home .logo{font-size:18px;font-weight:600}#ww-home .demo{font-size:12px;color:var(--muted)}#ww-home .shell{display:grid;grid-template-columns:160px minmax(0,1fr)}#ww-home aside{padding:24px 14px;background:var(--paper);border-right:1px solid var(--line)}#ww-home .navitem{display:block;padding:11px 12px;margin-bottom:7px;border-radius:8px;color:var(--muted)}#ww-home .navitem.active{background:var(--tint);color:var(--accent);font-weight:600}#ww-home .navhint{font-size:12px;margin:28px 12px;color:var(--muted)}#ww-home main{padding:26px;min-width:0}#ww-home h1{font-size:25px;margin:0 0 3px;font-weight:600}#ww-home h2{font-size:17px;margin:0;font-weight:600}#ww-home p{margin:5px 0}#ww-home .sub{color:var(--muted);font-size:12px}#ww-home .heading,#ww-home .row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}#ww-home .heading{margin-bottom:22px}#ww-home .panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px;margin:15px 0}#ww-home .controls{display:flex;align-items:end;gap:14px;flex-wrap:wrap}#ww-home label{display:grid;gap:5px;font-size:12px;color:var(--muted)}#ww-home select{background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:8px 10px;color:var(--ink)}#ww-home .pill{display:inline-block;font-size:12px;color:var(--good);background:light-dark(#ecf6f0,#203e34);padding:3px 9px;border-radius:20px}#ww-home .pill.warn{color:var(--warn);background:light-dark(#fff5e5,#45351e)}#ww-home .tasktitle{margin:15px 0 4px;font-size:21px;font-weight:600}#ww-home .steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:20px 0 12px}#ww-home .steps button{border:0;border-top:4px solid var(--line);border-radius:0;background:transparent;padding:8px 2px;text-align:left;font-size:12px}#ww-home .steps button.done{border-color:var(--good)}#ww-home .steps button.current{border-color:var(--accent);color:var(--accent)}#ww-home .detail{padding:12px 14px;background:var(--base);border-radius:7px;font-size:13px;min-height:65px}#ww-home .stats{display:flex;gap:25px;flex-wrap:wrap;margin-top:14px}#ww-home .stats strong{font-size:21px;font-weight:600;margin-right:4px}#ww-home .draft{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;padding:15px 0;border-top:1px solid var(--line);align-items:center}#ww-home .draft:first-of-type{margin-top:13px}#ww-home .num{color:var(--muted);font-size:13px}#ww-home .draftname{font-weight:500;margin-bottom:4px}#ww-home .annotation{color:var(--accent);font-size:12px;margin-top:10px;padding-left:10px;border-left:2px solid var(--accent)}#ww-home .marker{display:inline-flex;background:var(--tint);color:var(--accent);width:20px;height:20px;border-radius:50%;align-items:center;justify-content:center;font-size:12px;margin-right:7px}#ww-home .foot{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:14px 0}#ww-home .preview{border-top:1px solid var(--line);margin-top:15px;padding-top:15px}#ww-home .hidden,[hidden]{display:none!important}#ww-home .stopbox{margin-top:12px;padding:12px;background:var(--base);border-radius:8px}#ww-home .notice{color:var(--muted);font-size:12px}#ww-home .taskactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
@media(max-width:680px){#ww-home .shell{grid-template-columns:1fr}#ww-home aside{display:none}#ww-home main{padding:16px}#ww-home .top{padding-left:16px}#ww-home .draft{grid-template-columns:24px minmax(0,1fr)}#ww-home .draft button{grid-column:2;justify-self:start}#ww-home .panel{padding:15px}#ww-home .steps{grid-template-columns:repeat(3,minmax(0,1fr))}#ww-home .stats{gap:15px}}
#ww-home button{position:relative;overflow:hidden;transition:background .18s,border-color .18s,transform .12s,box-shadow .18s}#ww-home button:not(:disabled):hover{background:var(--tint);box-shadow:0 3px 10px light-dark(#225ac318,#98baff18)}#ww-home button.primary:not(:disabled):hover{background:var(--accent);filter:brightness(1.08)}#ww-home button:not(:disabled):active{transform:scale(.97)}#ww-home .steps button{border-top:0;padding-top:14px;border-radius:5px}#ww-home .steps button::before{content:'';position:absolute;inset:0 0 auto;height:4px;background:var(--line);border-radius:4px}#ww-home .steps button.done::before{background:var(--good)}#ww-home .steps button.current::before{background:var(--accent)}#ww-home .steps button[aria-pressed="true"]{background:var(--tint)}#ww-home .steps button.flowing::after{content:'';position:absolute;top:0;left:0;width:55%;height:4px;background:linear-gradient(90deg,transparent,light-dark(#ffffff,#e6f0ff),transparent);animation:ww-flow 1.8s linear infinite;pointer-events:none}#ww-home .click-wave{position:absolute;width:36px;height:36px;margin:-18px;border-radius:50%;background:currentColor;opacity:0;pointer-events:none;animation:ww-click .5s ease-out}#ww-home .detail.reveal{animation:ww-reveal .2s ease-out}@keyframes ww-flow{from{transform:translateX(-110%)}to{transform:translateX(290%)}}@keyframes ww-click{from{transform:scale(.1);opacity:.2}to{transform:scale(10);opacity:0}}@keyframes ww-reveal{from{opacity:.5;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){#ww-home button{transition:none}#ww-home .steps button.flowing::after,#ww-home .click-wave{display:none}#ww-home .detail.reveal{animation:none}#ww-home button:not(:disabled):active{transform:none}}@media(pointer:coarse){#ww-home button,#ww-home select{min-height:44px}}
</style>
<div class="top"><span class="logo">WeWriter</span><span class="demo">交互预览 · 示例数据</span></div>
<div class="shell"><aside aria-label="导航"><span class="navitem active">工作台</span><span class="navitem">公众号</span><span class="navitem">文章库</span><span class="navitem">稿件库</span><span class="navitem">设置</span></aside>
<main>
<div class="heading"><h1>工作台</h1></div>
<section class="panel" aria-label="新建任务">
<h2>新建任务</h2>
<div class="controls" style="margin-top:14px">
<label>文章范围<select id="ww-range"><option>今天</option><option>近 24 小时</option><option>近 3 天</option></select></label>
<label>生成篇数<select id="ww-count"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option></select></label>
<span class="sub" style="align-self:center">5 个公众号 · 热度优先</span>
<button class="primary" id="ww-start">开始任务</button>
</div><div id="ww-created" class="sub" aria-live="polite"></div>
</section>
<section class="panel" aria-label="当前任务">
<div class="row"><h2>当前任务</h2><div class="row"><span class="pill" id="ww-status"></span><button id="ww-history-toggle" aria-expanded="false">历史任务</button></div></div>
<div class="tasktitle" id="ww-tasktitle"></div><p class="sub" id="ww-meta"></p>
<div class="steps" id="ww-steps" aria-label="阶段详情"></div>
<div class="detail" id="ww-detail" aria-live="polite" hidden></div>
<div class="taskactions"><button id="ww-log" aria-expanded="false">查看详情</button><button id="ww-retry" hidden>重试失败项</button><button id="ww-stop">停止任务</button></div>
<div class="stopbox" id="ww-confirm" hidden>停止后保留已有稿件。<div class="taskactions"><button id="ww-cancel">继续运行</button><button id="ww-confirm-stop">确认停止</button></div></div>
<div class="detail" id="ww-events" hidden style="margin-top:12px"></div>
</section>
<section class="panel" aria-label="本次稿件"><h2>本次稿件</h2><div id="ww-drafts"></div>
<div class="preview" id="ww-preview" hidden><h2 id="ww-preview-title"></h2><p class="sub">示例预览，尚未接入真实稿件。</p><button id="ww-close">收起</button></div></section>
<section id="ww-history" class="panel" aria-label="历史任务" hidden><div class="row"><h2>历史任务</h2><span class="sub">最近 10 条 · 中国时间</span></div><div id="ww-history-list"></div><p id="ww-history-feedback" class="sub" role="status"></p></section>
</main></div>
<script>
(()=>{
const root=document.getElementById('ww-home'),q=s=>root.querySelector(s);
let scene='running',target=2,range='今天';
const names=['采集','预检','写作','二审','待审核'];
const details=['返回 18 篇 · 时间范围内 8 篇','正文可用 6 篇 · 不可用 2 篇','按热度处理可用文章','核对标题、引语和来源','人工审核后计入合格交付'];
const titles=['行业变化如何影响项目决策','企业面对新政策应先确认什么','从项目案例看执行中的难点','行业数据背后的变化','给从业者的行动建议'];
function render(){
const collecting=scene==='collecting',blocked=scene==='blocked',finished=scene==='finished',stopped=scene==='stopped';
const idx=collecting||blocked?0:finished?4:3;
q('#ww-status').textContent=collecting?'采集中':blocked?'采集异常':finished?'待审核':stopped?'已停止':'生成中';
q('#ww-status').className='pill'+(blocked||stopped?' warn':'');
q('#ww-tasktitle').textContent=collecting?'正在采集 · 2 / 5 个公众号':blocked?'1 个公众号采集失败':finished?target+' 篇待审核':stopped?'已停止，稿件已保留':target===1?'1 篇正在二审':'1 篇待审核，'+(target-1)+' 篇处理中';
q('#ww-meta').textContent=range+' · 目标 '+target+' 篇 · 已用时 '+(collecting?'32 秒':'4 分 12 秒');
q('#ww-steps').innerHTML=names.map((n,i)=>'<button data-stage="'+i+'" class="'+(i<idx?'done':i===idx?'current'+(collecting||scene==='running'?' flowing':''):'')+'" aria-pressed="false">'+(i<idx?'✓ ':i+1+' ')+n+'</button>').join('');
q('#ww-detail').hidden=true;
q('#ww-events').hidden=true;q('#ww-log').textContent='查看详情';q('#ww-log').setAttribute('aria-expanded','false');
q('#ww-events').textContent=blocked?'请求超时；其余 4 个公众号结果已保留，可单独重试。':collecting?'2 个公众号已响应，已返回 7 篇文章。':stopped?'不再安排后续处理，已有稿件保留。':'返回 18 篇 · 时间范围内 8 篇 · 正文可用 6 篇 · 审核通过 0 / '+target;
q('#ww-retry').hidden=!blocked;q('#ww-stop').disabled=finished||stopped;
q('#ww-confirm').hidden=true;q('#ww-preview').hidden=true;
q('#ww-drafts').innerHTML=collecting||blocked?'<p class="sub" style="margin-top:14px">等待采集完成</p>':Array.from({length:target},(_,i)=>{
const ready=finished||i===0&&target>1;
return '<div class="draft"><span class="num">0'+(i+1)+'</span><div><div class="draftname">'+titles[i]+'</div><span class="sub">'+(ready?'待审核':stopped?'已停止':i===1||target===1?'二审中':'排队中')+'</span></div><button data-read="'+i+'" '+(ready?'':'disabled')+'>查看稿件</button></div>';
}).join('');
}
q('#ww-start').onclick=()=>{target=Number(q('#ww-count').value);range=q('#ww-range').value;scene='collecting';render();q('#ww-created').textContent='已创建演示任务';};
q('#ww-steps').onclick=e=>{const b=e.target.closest('[data-stage]');if(!b)return;const panel=q('#ww-detail');panel.hidden=false;panel.textContent=details[Number(b.dataset.stage)];panel.classList.remove('reveal');void panel.offsetWidth;panel.classList.add('reveal');root.querySelectorAll('[data-stage]').forEach(x=>x.setAttribute('aria-pressed',x===b));};
q('#ww-log').onclick=()=>{const panel=q('#ww-events');panel.hidden=!panel.hidden;q('#ww-log').textContent=panel.hidden?'查看详情':'收起详情';q('#ww-log').setAttribute('aria-expanded',!panel.hidden);};
q('#ww-retry').onclick=()=>{scene='collecting';render();q('#ww-tasktitle').textContent='正在重试 · 1 个公众号';q('#ww-events').textContent='保留其余 4 个公众号的结果，仅重试失败项。';};
q('#ww-stop').onclick=()=>{q('#ww-confirm').hidden=false;q('#ww-cancel').focus();};
q('#ww-cancel').onclick=()=>{q('#ww-confirm').hidden=true;q('#ww-stop').focus();};
q('#ww-confirm-stop').onclick=()=>{scene='stopped';render();q('#ww-log').focus();};
q('#ww-drafts').onclick=e=>{const b=e.target.closest('[data-read]');if(!b||b.disabled)return;q('#ww-preview-title').textContent=titles[Number(b.dataset.read)];q('#ww-preview').hidden=false;};
q('#ww-close').onclick=()=>q('#ww-preview').hidden=true;
const history=[{id:32,time:'10-24 15:20',status:'已完成',count:'2 / 2',detail:'生成 2 篇，人工审核通过 2 篇。'}, {id:31,time:'10-24 09:10',status:'部分完成',count:'1 / 2',detail:'1 篇已审核通过；剩余候选正文不可用。继续原任务不会重新采集。'}, {id:30,time:'10-23 14:30',status:'失败',count:'0 / 2',detail:'采集请求超时，未生成稿件。'}];
q('#ww-history-list').innerHTML=history.map(a=>'<div style="padding:14px 0;border-top:1px solid var(--line);margin-top:10px"><div class="row"><span>'+a.time+' · '+a.status+'</span><span class="sub">合格稿件 '+a.count+'</span><button data-history="'+a.id+'" aria-expanded="false">详情</button></div><div id="ww-h-'+a.id+'" class="detail" hidden style="margin-top:10px">'+a.detail+(a.id!==32?'<div class="taskactions"><button data-history-retry="'+a.id+'">'+(a.id===30?'重试失败项':'继续原任务')+'</button></div>':'')+'</div></div>').join('');
q('#ww-history-toggle').onclick=()=>{q('#ww-history').hidden=!q('#ww-history').hidden;q('#ww-history-toggle').setAttribute('aria-expanded',!q('#ww-history').hidden);if(!q('#ww-history').hidden)q('[data-history]').focus();};
q('#ww-history-list').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.history){const p=q('#ww-h-'+b.dataset.history);p.hidden=!p.hidden;b.textContent=p.hidden?'详情':'收起';b.setAttribute('aria-expanded',!p.hidden);}else if(b.dataset.historyRetry){q('#ww-history-feedback').textContent='演示：当前有任务运行，请等待结束后再重试。已有稿件保留。';}};
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const box=b.getBoundingClientRect(),wave=document.createElement('span');wave.className='click-wave';wave.setAttribute('aria-hidden','true');wave.style.left=(e.detail?e.clientX-box.left:box.width/2)+'px';wave.style.top=(e.detail?e.clientY-box.top:box.height/2)+'px';b.append(wave);setTimeout(()=>wave.remove(),550);});
render();
if(globalThis.Tweak){const state={scene:'running'};const t=new Tweak({container:root,onChange:()=>{scene=state.scene;render();}});t.addSelect(state,'scene',{label:'预览状态',options:[{label:'生成中',value:'running'},{label:'采集中',value:'collecting'},{label:'采集异常',value:'blocked'},{label:'待审核',value:'finished'},{label:'已停止',value:'stopped'}]});}
})();
</script>
</div>
