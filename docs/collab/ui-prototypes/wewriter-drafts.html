<div id="ww-drafts">
<style>
#ww-drafts{--paper:light-dark(#fff,#20252d);--base:light-dark(#f4f6f8,#14181f);--ink:light-dark(#172638,#eef2f7);--muted:light-dark(#627183,#aab6c6);--line:light-dark(#dfe5ec,#38414d);--accent:light-dark(#225ac3,#98baff);--tint:light-dark(#edf3ff,#243859);--warn:light-dark(#925618,#edc788);--good:light-dark(#206c53,#8dd3b7);font:14px/1.55 'Microsoft YaHei',sans-serif;color:var(--ink);background:var(--base);border-radius:14px;overflow:hidden;color-scheme:light dark}#ww-drafts *{box-sizing:border-box}#ww-drafts [hidden]{display:none!important}#ww-drafts .top{padding:14px 100px 14px 22px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px}#ww-drafts .logo{font-size:18px;font-weight:600}#ww-drafts .sub{font-size:12px;color:var(--muted)}#ww-drafts .shell{display:grid;grid-template-columns:160px minmax(0,1fr)}#ww-drafts aside{padding:24px 14px;background:var(--paper);border-right:1px solid var(--line)}#ww-drafts .navitem{display:block;padding:11px 12px;margin-bottom:7px;border-radius:8px;color:var(--muted)}#ww-drafts .active{background:var(--tint);color:var(--accent)}#ww-drafts main{padding:26px;min-width:0}#ww-drafts h1{font-size:25px;margin:0 0 22px;font-weight:600}#ww-drafts h2{font-size:20px;margin:0;overflow-wrap:anywhere}#ww-drafts button,#ww-drafts input,#ww-drafts select,#ww-drafts textarea{font:inherit;color:inherit}#ww-drafts button{position:relative;overflow:hidden;background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:7px 12px;transition:background .18s,transform .12s}#ww-drafts button:not(:disabled):hover{background:var(--tint);border-color:var(--accent)}#ww-drafts button:not(:disabled):active{transform:scale(.97)}#ww-drafts button:disabled{opacity:.5}#ww-drafts button.primary{background:var(--accent);color:light-dark(#fff,#14243f)}#ww-drafts input,#ww-drafts select,#ww-drafts textarea{background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:9px 10px;min-width:0;max-width:100%}#ww-drafts .filters,#ww-drafts .actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}#ww-drafts .search{flex:1;min-width:150px}#ww-drafts .list{margin-top:14px;padding:0 18px;background:var(--paper);border:1px solid var(--line);border-radius:12px}#ww-drafts .draft{padding:20px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 18px;align-items:center}#ww-drafts .draft:last-child{border:0}#ww-drafts .title{font-size:15px;font-weight:500;overflow-wrap:anywhere}#ww-drafts .meta{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:7px}#ww-drafts .warn{color:var(--warn)}#ww-drafts .good{color:var(--good)}#ww-drafts .row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}#ww-drafts .reader{margin-top:16px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:22px}#ww-drafts .body{line-height:1.9;margin:20px 0;white-space:pre-wrap;overflow-wrap:anywhere}#ww-drafts details{border-top:1px solid var(--line);padding-top:12px;margin-top:18px;font-size:12px;color:var(--muted)}#ww-drafts summary{padding:5px 0;color:var(--ink)}#ww-drafts .notice{margin-top:12px;font-size:12px;color:var(--muted)}#ww-drafts .notice:empty{display:none}#ww-drafts .empty{padding:35px 0;text-align:center;color:var(--muted)}#ww-drafts .box{background:var(--base);padding:14px;border-radius:8px;margin:14px 0}#ww-drafts label.field{display:grid;gap:6px;margin:14px 0}#ww-drafts textarea{width:100%;min-height:220px;resize:vertical;line-height:1.8}#ww-drafts .wave{position:absolute;width:36px;height:36px;margin:-18px;border-radius:50%;background:currentColor;pointer-events:none;animation:wwd-wave .5s ease-out forwards}@keyframes wwd-wave{from{transform:scale(.1);opacity:.18}to{transform:scale(10);opacity:0}}@media(prefers-reduced-motion:reduce){#ww-drafts button{transition:none}#ww-drafts button:active{transform:none}#ww-drafts .wave{display:none}}@media(max-width:680px){#ww-drafts .shell{grid-template-columns:1fr}#ww-drafts aside{display:none}#ww-drafts main{padding:16px}#ww-drafts .draft{grid-template-columns:1fr}#ww-drafts .draft>button{justify-self:start}#ww-drafts .reader{padding:16px}}@media(pointer:coarse){#ww-drafts button,#ww-drafts input,#ww-drafts select,#ww-drafts summary{min-height:44px}#ww-drafts input,#ww-drafts textarea,#ww-drafts select{font-size:16px}}
</style>
<div class="top"><span class="logo">WeWriter</span><span class="sub">交互预览 · 示例数据</span></div>
<div class="shell"><aside aria-label="导航"><span class="navitem">工作台</span><span class="navitem">公众号</span><span class="navitem">文章库</span><span class="navitem active">稿件库</span><span class="navitem">设置</span></aside><main>
<div id="dr-library"><h1>稿件库</h1><div class="filters"><input id="dr-search" class="search" type="search" aria-label="搜索稿件" placeholder="搜索稿件标题"><select id="dr-filter" aria-label="审核状态"><option value="">全部状态</option><option>待审核</option><option>需修改</option><option>已通过</option></select></div><p id="dr-count" class="sub" role="status"></p><div id="dr-list" class="list"></div></div>
<section id="dr-reader" hidden aria-label="稿件详情"><div class="row"><button id="dr-back" class="cursor-interaction">← 返回稿件库</button><span id="dr-status" class="sub"></span></div><div class="reader"><h2 id="dr-title"></h2><div class="meta" id="dr-meta"></div><p id="dr-warning" class="warn" hidden></p><div id="dr-body" class="body"></div>
<form id="dr-editor" hidden><label class="field">标题<input id="dr-titleinput" maxlength="120" required></label><label class="field">正文<textarea id="dr-textinput" required></textarea></label><div class="actions"><button type="submit" class="primary cursor-interaction">保存修改</button><button type="button" id="dr-cancel" class="cursor-interaction">取消编辑</button></div><p class="sub">保存修改后需重新审核。</p></form>
<div id="dr-actions" class="actions"><button id="dr-edit" class="cursor-interaction">编辑</button><button id="dr-revise" class="cursor-interaction">标记需修改</button><button id="dr-approve" class="primary cursor-interaction">审核通过</button><button id="dr-export" class="cursor-interaction">导出</button></div>
<div id="dr-confirm" class="box" hidden><p>已核对正文、事实与来源，确认审核通过？</p><div class="actions"><button id="dr-confirmyes" class="primary cursor-interaction">确认通过</button><button id="dr-confirmno" class="cursor-interaction">继续检查</button></div></div>
<div id="dr-exportbox" class="box" hidden><div class="actions"><label>格式 <select id="dr-format"><option>Word（.docx）</option><option>Markdown（.md）</option></select></label><button id="dr-exportgo" class="primary cursor-interaction">导出发布稿</button></div><p class="sub">发布稿不含来源编号、审核备注；来源对应关系保留在素材报告中。</p><button id="dr-report" class="cursor-interaction">导出素材报告</button></div>
<p id="dr-feedback" class="notice" role="status"></p><details id="dr-details"><summary class="cursor-interaction">来源与审核提示</summary><p id="dr-source"></p><p id="dr-audit"></p></details></div></section>
</main></div>
<script>
(()=>{
const root=document.getElementById('ww-drafts'),q=s=>root.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const drafts=[{id:1,title:'新政策落地，企业先看清这三个条件',status:'待审核',time:'10-25 10:36',source:'示例公众号A',warn:'1 处引语待核实',audit:'请逐字核对第二段引语及原始来源。'},{id:2,title:'证书之外，造价从业者还能做哪些准备',status:'需修改',time:'10-25 10:32',source:'示例公众号D',warn:'标题结论需要核实',audit:'资料不足以支持标题中的结论，请修改或补充依据。'},{id:3,title:'项目成本控制，从明确责任边界开始',status:'已通过',time:'10-24 16:20',source:'示例公众号C',warn:'',audit:'示例：已由人工确认。'}].map(a=>({...a,body:'【交互示例，非真实生成稿】\n\n这里展示稿件正文。你可以直接编辑标题和内容，保存后重新审核，再导出给客户。\n\n来源和审核记录单独保留，发布稿保持干净。'}));let current=null,editing=false;
function list(){const term=q('#dr-search').value.trim().toLowerCase(),status=q('#dr-filter').value,rows=drafts.filter(a=>a.title.toLowerCase().includes(term)&&(!status||a.status===status));q('#dr-count').textContent='共 '+rows.length+' 篇 · 最新生成优先';q('#dr-list').innerHTML=rows.length?rows.map(a=>'<article class="draft"><div><div class="title">'+esc(a.title)+'</div><div class="meta"><span class="'+(a.status==='已通过'?'good':a.status==='需修改'?'warn':'')+'">'+a.status+'</span><span>'+a.time+'（中国时间）</span>'+(a.warn?'<span class="warn">'+esc(a.warn)+'</span>':'')+'</div></div><button data-open="'+a.id+'" class="cursor-interaction">查看稿件</button></article>').join(''):'<div class="empty">没有符合条件的稿件</div>';}
function show(){const a=current;editing=false;q('#dr-library').hidden=true;q('#dr-reader').hidden=false;q('#dr-title').textContent=a.title;q('#dr-status').textContent=a.status;q('#dr-meta').textContent=a.time+'（中国时间）';q('#dr-body').textContent=a.body;q('#dr-body').hidden=false;q('#dr-editor').hidden=true;q('#dr-actions').hidden=false;q('#dr-confirm').hidden=true;q('#dr-exportbox').hidden=true;q('#dr-feedback').textContent='';q('#dr-warning').hidden=!a.warn;q('#dr-warning').textContent=a.warn;q('#dr-source').textContent='参考文章：'+a.source+'（示例；正式版可查看原文与来源对应关系）';q('#dr-audit').textContent=a.audit;q('#dr-approve').disabled=a.status==='已通过';q('#dr-revise').disabled=a.status==='需修改';}
q('#dr-search').oninput=list;q('#dr-filter').onchange=list;q('#dr-list').onclick=e=>{const b=e.target.closest('[data-open]');if(!b)return;current=drafts.find(a=>a.id===Number(b.dataset.open));q('#dr-details').open=false;show();q('#dr-back').focus();};
q('#dr-back').onclick=()=>{if(editing&&(q('#dr-titleinput').value!==current.title||q('#dr-textinput').value!==current.body)){q('#dr-feedback').textContent='有未保存修改，请先保存或取消编辑。';return;}q('#dr-reader').hidden=true;q('#dr-library').hidden=false;list();const b=q('[data-open="'+current.id+'"]');if(b)b.focus();};
q('#dr-edit').onclick=()=>{editing=true;q('#dr-body').hidden=true;q('#dr-actions').hidden=true;q('#dr-confirm').hidden=true;q('#dr-exportbox').hidden=true;q('#dr-editor').hidden=false;q('#dr-titleinput').value=current.title;q('#dr-textinput').value=current.body;q('#dr-titleinput').focus();};
q('#dr-cancel').onclick=()=>{show();q('#dr-edit').focus();};q('#dr-editor').onsubmit=e=>{e.preventDefault();if(!q('#dr-titleinput').value.trim()||!q('#dr-textinput').value.trim()){q('#dr-feedback').textContent='标题和正文不能为空';return;}current.title=q('#dr-titleinput').value.trim();current.body=q('#dr-textinput').value;current.status='待审核';show();q('#dr-feedback').textContent='修改已保存到本次预览，等待重新审核。';};
q('#dr-revise').onclick=()=>{current.status='需修改';show();q('#dr-feedback').textContent='已标记需修改';};q('#dr-approve').onclick=()=>{q('#dr-confirm').hidden=false;q('#dr-confirmno').focus();};q('#dr-confirmno').onclick=()=>{q('#dr-confirm').hidden=true;q('#dr-approve').focus();};q('#dr-confirmyes').onclick=()=>{current.status='已通过';current.audit+=' 已在本次预览中人工确认。';current.warn='';show();q('#dr-feedback').textContent='已审核通过，可导出发布稿。';q('#dr-export').focus();};
q('#dr-export').onclick=()=>{q('#dr-exportbox').hidden=!q('#dr-exportbox').hidden;q('#dr-feedback').textContent=current.status==='已通过'?'':'此稿尚未审核通过，导出前请先检查。';};q('#dr-exportgo').onclick=()=>q('#dr-feedback').textContent='演示：将导出'+q('#dr-format').value+'发布稿。本预览不生成文件、不发布文章。';q('#dr-report').onclick=()=>q('#dr-feedback').textContent='演示：素材报告包含来源对应关系与审核记录。本预览不生成文件。';
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!b.isConnected||b.disabled)return;const r=b.getBoundingClientRect(),w=document.createElement('span');w.className='wave';w.setAttribute('aria-hidden','true');w.style.left=(e.detail?e.clientX-r.left:r.width/2)+'px';w.style.top=(e.detail?e.clientY-r.top:r.height/2)+'px';b.append(w);setTimeout(()=>w.remove(),550);});list();
})();
</script>
</div>
