<div id="ww-articles">
<style>
#ww-articles{--paper:light-dark(#fff,#20252d);--base:light-dark(#f4f6f8,#14181f);--ink:light-dark(#172638,#eef2f7);--muted:light-dark(#627183,#aab6c6);--line:light-dark(#dfe5ec,#38414d);--accent:light-dark(#225ac3,#98baff);--tint:light-dark(#edf3ff,#243859);--warn:light-dark(#925618,#edc788);font:14px/1.55 'Microsoft YaHei',sans-serif;color:var(--ink);background:var(--base);border-radius:14px;overflow:hidden;color-scheme:light dark}#ww-articles *{box-sizing:border-box}#ww-articles [hidden]{display:none!important}#ww-articles .top{padding:14px 100px 14px 22px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px}#ww-articles .logo{font-size:18px;font-weight:600}#ww-articles .sub{font-size:12px;color:var(--muted)}#ww-articles .shell{display:grid;grid-template-columns:160px minmax(0,1fr)}#ww-articles aside{padding:24px 14px;background:var(--paper);border-right:1px solid var(--line)}#ww-articles .navitem{display:block;padding:11px 12px;margin-bottom:7px;border-radius:8px;color:var(--muted)}#ww-articles .active{background:var(--tint);color:var(--accent)}#ww-articles main{padding:26px;min-width:0}#ww-articles h1{font-size:25px;margin:0 0 22px;font-weight:600}#ww-articles h2{font-size:20px;margin:0;overflow-wrap:anywhere}#ww-articles button,#ww-articles input,#ww-articles select{font:inherit;color:inherit}#ww-articles button{position:relative;overflow:hidden;background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:7px 12px;transition:background .18s,transform .12s}#ww-articles button:hover{background:var(--tint);border-color:var(--accent)}#ww-articles button:active{transform:scale(.97)}#ww-articles input,#ww-articles select{background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:8px 10px;min-width:0;max-width:100%}#ww-articles .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}#ww-articles .search{flex:1;min-width:150px}#ww-articles .list{margin-top:14px;padding:0 18px;background:var(--paper);border:1px solid var(--line);border-radius:12px}#ww-articles .article{padding:18px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 18px;align-items:center}#ww-articles .article:last-child{border:0}#ww-articles .title{font-size:15px;font-weight:500;overflow-wrap:anywhere}#ww-articles .meta{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}#ww-articles .metrics{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:9px}#ww-articles .metrics strong{font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}#ww-articles .warn{color:var(--warn)}#ww-articles .status{color:var(--accent)}#ww-articles .row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}#ww-articles .reader{margin-top:16px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:22px}#ww-articles .body{line-height:1.9;margin:20px 0;white-space:pre-wrap}#ww-articles details{border-top:1px solid var(--line);padding-top:12px;font-size:12px;color:var(--muted)}#ww-articles summary{padding:5px 0;color:var(--ink)}#ww-articles .notice{margin-top:12px;font-size:12px;color:var(--muted)}#ww-articles .notice:empty{display:none}#ww-articles .empty{padding:35px 0;text-align:center;color:var(--muted)}#ww-articles .wave{position:absolute;width:36px;height:36px;margin:-18px;border-radius:50%;background:currentColor;pointer-events:none;animation:wwar-wave .5s ease-out forwards}@keyframes wwar-wave{from{transform:scale(.1);opacity:.18}to{transform:scale(10);opacity:0}}@media(prefers-reduced-motion:reduce){#ww-articles button{transition:none}#ww-articles button:active{transform:none}#ww-articles .wave{display:none}}@media(max-width:680px){#ww-articles .shell{grid-template-columns:1fr}#ww-articles aside{display:none}#ww-articles main{padding:16px}#ww-articles .article{grid-template-columns:1fr}#ww-articles .article>button{justify-self:start}#ww-articles .reader{padding:16px}}@media(pointer:coarse){#ww-articles button,#ww-articles input,#ww-articles select,#ww-articles summary{min-height:44px}#ww-articles input,#ww-articles select{font-size:16px}}
</style>
<div class="top"><span class="logo">WeWriter</span><span class="sub">交互预览 · 示例数据</span></div>
<div class="shell"><aside aria-label="导航"><span class="navitem">工作台</span><span class="navitem">公众号</span><span class="navitem active">文章库</span><span class="navitem">稿件库</span><span class="navitem">设置</span></aside><main>
<h1>文章库</h1>
<div class="filters"><input id="ar-search" class="search" type="search" aria-label="搜索文章标题" placeholder="搜索文章标题"><select id="ar-account" aria-label="公众号筛选"><option value="">全部公众号</option><option>示例公众号A</option><option>示例公众号D</option><option>示例公众号C</option><option>示例公众号E</option></select><select id="ar-period" aria-label="发布时间筛选"><option value="all">全部时间</option><option value="today">今天</option><option value="three">近 3 天</option></select><select id="ar-sort" aria-label="文章排序"><option value="read">阅读量优先</option><option value="like">点赞量优先</option><option value="new">最新发布</option></select></div>
<div class="row" style="margin-top:14px"><span id="ar-count" class="sub" role="status"></span><span class="sub">发布时间 · 中国时间</span></div>
<div id="ar-list" class="list"></div>
<section id="ar-reader" class="reader" hidden aria-label="文章详情"><div class="row"><h2 id="ar-title"></h2><button id="ar-close" class="cursor-interaction">收起</button></div><div class="meta" id="ar-meta"></div><div id="ar-body" class="body"></div><button id="ar-original" class="cursor-interaction">打开原文</button><p id="ar-feedback" class="notice" role="status"></p><details id="ar-diagnostics" style="margin-top:18px"><summary class="cursor-interaction">采集详情</summary><div id="ar-source" style="padding:10px 0;line-height:1.9"></div></details></section>
</main></div>
<script>
(()=>{
const root=document.getElementById('ww-articles'),q=s=>root.querySelector(s);
const articles=[
{id:1,title:'新政策落地，企业申报前要确认哪些条件？',account:'示例公众号A',date:'2026-10-25 09:15',read:4904,like:17,state:'未使用',body:true},
{id:2,title:'今年的一级造价师考试，考生在讨论什么',account:'示例公众号D',date:'2026-10-25 08:20',read:1068,like:0,state:'已用于生成',body:true},
{id:3,title:'项目成本控制，先从哪些环节入手',account:'示例公众号C',date:'2026-10-25 07:40',read:2806,like:32,state:'未使用',body:true},
{id:4,title:'工程咨询服务的几个常见问题',account:'示例公众号E',date:'2026-10-24 16:05',read:null,like:null,state:'正文未获取',body:false},
{id:5,title:'产业补贴申报，企业容易忽略的细节',account:'示例公众号A',date:'2026-10-23 10:30',read:0,like:0,state:'未使用',body:true}
];let opened=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const metric=n=>n===null?'未知':n.toLocaleString('zh-CN');
function render(){const term=q('#ar-search').value.trim().toLowerCase(),account=q('#ar-account').value,period=q('#ar-period').value,sort=q('#ar-sort').value;const rows=articles.filter(a=>a.title.toLowerCase().includes(term)&&(!account||a.account===account)&&(period==='all'||a.date.slice(0,10)>=(period==='today'?'2026-10-25':'2026-10-23'))).sort((a,b)=>sort==='new'?b.date.localeCompare(a.date):((b[sort]??-1)-(a[sort]??-1)||b.date.localeCompare(a.date)));
q('#ar-count').textContent='共 '+rows.length+' 篇';q('#ar-list').innerHTML=rows.length?rows.map(a=>'<article class="article"><div><div class="title">'+esc(a.title)+'</div><div class="meta"><span>'+esc(a.account)+'</span><span>'+a.date.slice(5)+'</span><span class="'+(!a.body?'warn':a.state==='已用于生成'?'status':'')+'">'+a.state+'</span></div><div class="metrics"><span>阅读 <strong>'+metric(a.read)+'</strong></span><span>点赞 <strong>'+metric(a.like)+'</strong></span></div></div><button class="cursor-interaction" data-open="'+a.id+'" aria-expanded="'+(opened===a.id)+'">'+(a.body?'查看文章':'查看详情')+'</button></article>').join(''):'<div class="empty">没有符合条件的文章</div>';}
function close(){const id=opened;opened=null;q('#ar-reader').hidden=true;render();const b=q('[data-open="'+id+'"]');if(b)b.focus();}
q('#ar-search').oninput=()=>{opened=null;q('#ar-reader').hidden=true;render();};['#ar-account','#ar-period','#ar-sort'].forEach(s=>q(s).onchange=()=>{opened=null;q('#ar-reader').hidden=true;render();});
q('#ar-list').onclick=e=>{const b=e.target.closest('[data-open]');if(!b)return;opened=Number(b.dataset.open);const a=articles.find(a=>a.id===opened);q('#ar-title').textContent=a.title;q('#ar-meta').textContent=a.account+' · '+a.date+'（中国时间）';q('#ar-body').textContent=a.body?'正文预览占位\n\n正式版在这里展示已采集的原文内容。本页为示例，未读取真实文章。':'正文暂未获取，可前往原文查看。';q('#ar-source').textContent='来源：极致了（示例）｜采集方式：文章列表｜采集时间：2026-10-25 10:00（中国时间）｜阅读：'+metric(a.read)+'｜点赞：'+metric(a.like)+(a.body?'':'｜正文获取失败：请求超时（示例）');q('#ar-diagnostics').open=!a.body;q('#ar-feedback').textContent='';q('#ar-reader').hidden=false;render();q('#ar-close').focus();};
q('#ar-close').onclick=close;q('#ar-original').onclick=()=>q('#ar-feedback').textContent='示例未绑定真实链接；正式版将在浏览器中打开这篇文章。';
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!b.isConnected)return;const r=b.getBoundingClientRect(),w=document.createElement('span');w.className='wave';w.setAttribute('aria-hidden','true');w.style.left=(e.detail?e.clientX-r.left:r.width/2)+'px';w.style.top=(e.detail?e.clientY-r.top:r.height/2)+'px';b.append(w);setTimeout(()=>w.remove(),550);});render();
})();
</script>
</div>
