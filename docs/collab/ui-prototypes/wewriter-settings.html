<div id="ww-settings">
<style>
#ww-settings{--paper:light-dark(#fff,#20252d);--base:light-dark(#f4f6f8,#14181f);--ink:light-dark(#172638,#eef2f7);--muted:light-dark(#627183,#aab6c6);--line:light-dark(#dfe5ec,#38414d);--accent:light-dark(#225ac3,#98baff);--tint:light-dark(#edf3ff,#243859);font:14px/1.55 'Microsoft YaHei',sans-serif;color:var(--ink);background:var(--base);border-radius:14px;overflow:hidden;color-scheme:light dark}#ww-settings *{box-sizing:border-box}#ww-settings [hidden]{display:none!important}#ww-settings .top{padding:14px 100px 14px 22px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px}#ww-settings .logo{font-size:18px;font-weight:600}#ww-settings .sub{font-size:12px;color:var(--muted)}#ww-settings .shell{display:grid;grid-template-columns:160px minmax(0,1fr)}#ww-settings aside{padding:24px 14px;background:var(--paper);border-right:1px solid var(--line)}#ww-settings .navitem{display:block;padding:11px 12px;margin-bottom:7px;border-radius:8px;color:var(--muted)}#ww-settings .active{background:var(--tint);color:var(--accent)}#ww-settings main{padding:26px;min-width:0}#ww-settings h1{font-size:25px;margin:0 0 22px;font-weight:600}#ww-settings h2{font-size:16px;margin:0 0 16px}#ww-settings button,#ww-settings select,#ww-settings textarea{font:inherit;color:inherit}#ww-settings button{background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:8px 14px;transition:background .18s,transform .12s}#ww-settings button:not(:disabled):hover{background:var(--tint);border-color:var(--accent)}#ww-settings button:not(:disabled):active{transform:scale(.97)}#ww-settings button:disabled{opacity:.45}#ww-settings button.primary{background:var(--accent);color:light-dark(#fff,#14243f)}#ww-settings select,#ww-settings textarea{background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:9px 10px;max-width:100%;min-width:0}#ww-settings .panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px;margin:15px 0}#ww-settings .row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}#ww-settings .fields{display:grid;grid-template-columns:1fr 1fr;gap:18px}#ww-settings .field{display:grid;gap:7px}#ww-settings textarea{width:100%;resize:vertical;min-height:88px;line-height:1.7}#ww-settings .actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}#ww-settings p{margin:8px 0}#ww-settings .service{display:flex;gap:22px;flex-wrap:wrap}#ww-settings .service span{font-size:12px;color:var(--muted)}#ww-settings .service b{font-weight:500;color:var(--ink);margin-right:6px}#ww-settings details{margin-top:14px;font-size:12px;color:var(--muted)}#ww-settings summary{color:var(--ink);padding:5px 0}#ww-settings .feedback{font-size:12px;color:var(--accent);min-height:20px}#ww-settings .folder{background:var(--base);padding:12px;border-radius:7px;margin-top:12px}@media(max-width:680px){#ww-settings .shell{grid-template-columns:1fr}#ww-settings aside{display:none}#ww-settings main{padding:16px}#ww-settings .fields{grid-template-columns:1fr}#ww-settings .panel{padding:16px}}@media(prefers-reduced-motion:reduce){#ww-settings button{transition:none}#ww-settings button:active{transform:none}}@media(pointer:coarse){#ww-settings button,#ww-settings select,#ww-settings summary{min-height:44px}#ww-settings select,#ww-settings textarea{font-size:16px}}
#ww-settings input{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:9px 10px;min-width:0;max-width:100%}#ww-settings .keyrow{display:flex;gap:8px;align-items:center}#ww-settings .keyrow input{flex:1;width:100%}@media(pointer:coarse){#ww-settings input{font-size:16px;min-height:44px}}
</style>
<div class="top"><span class="logo">WeWriter</span><span class="sub">交互预览 · 示例设置</span></div>
<div class="shell"><aside aria-label="导航"><span class="navitem">工作台</span><span class="navitem">公众号</span><span class="navitem">文章库</span><span class="navitem">稿件库</span><span class="navitem active">设置</span></aside><main>
<h1>设置</h1>
<form id="st-form">
<section class="panel" aria-label="模型配置"><h2>模型</h2><div class="fields"><label class="field">写作与二审<select id="st-model"><option value="configured">已配置模型（示例）</option><option value="custom">自定义模型</option></select></label><label class="field" id="st-customfield" hidden>模型名称<input id="st-custommodel" placeholder="填写服务商提供的模型名称" autocomplete="off"></label></div><div class="field" style="margin-top:16px"><label for="st-key">API Key</label><div class="keyrow"><input id="st-key" type="password" autocomplete="off" spellcheck="false" placeholder="仅输入虚构密钥体验，请勿填写真实 Key"><button type="button" id="st-keytoggle" class="cursor-interaction" aria-pressed="false">显示</button></div></div><details><summary class="cursor-interaction">接口地址</summary><label class="field"><span>API 地址</span><input id="st-endpoint" type="url" value="https://api.example.invalid/v1" autocomplete="off"></label></details><p class="sub">模型选项以实际接入服务为准。</p></section>
<section class="panel" aria-label="写作偏好"><h2>写作偏好</h2><div class="fields"><label class="field">目标篇幅<select id="st-length"><option value="800">约 800 字</option><option value="1200" selected>约 1200 字</option><option value="1500">约 1500 字</option><option value="2000">约 2000 字</option></select></label><label class="field">写作风格<select id="st-style"><option value="reference">参考原文风格</option><option value="plain">通俗自然</option><option value="professional">专业简洁</option></select></label></div><label class="field" style="margin-top:16px">补充要求 <textarea id="st-instructions" maxlength="1000" placeholder="可选，例如：面向工程从业者，少用术语，段落简短。"></textarea></label></section>
<section class="panel" aria-label="导出设置"><h2>导出</h2><div class="fields"><label class="field">默认格式<select id="st-format"><option value="docx">Word（.docx）</option><option value="md">Markdown（.md）</option></select></label><div class="field"><span>保存位置</span><div class="actions"><span id="st-location" class="sub">每次导出时选择</span><button type="button" id="st-folder" class="cursor-interaction" aria-expanded="false">更改</button></div></div></div><div class="folder" id="st-folderbox" hidden><label class="field">保存方式<select id="st-locationchoice"><option value="ask">每次导出时选择</option><option value="documents">文档 / WeWriter（示例）</option></select></label><p class="sub">正式版可选择本机文件夹。</p></div></section>
<div class="actions"><button type="submit" class="primary cursor-interaction" id="st-save" disabled>保存设置</button><button type="button" id="st-discard" class="cursor-interaction" disabled>撤销修改</button><span class="sub" id="st-dirty">设置已保存</span></div><p id="st-feedback" class="feedback" role="status"></p>
</form>
<section class="panel" aria-label="服务状态"><div class="row"><div class="service"><span><b>文章采集</b>待检查</span><span><b>文章生成</b>待检查</span></div><button id="st-check" class="cursor-interaction">检查连接</button></div><p id="st-checkresult" class="sub" role="status" hidden></p><details><summary class="cursor-interaction">连接异常时怎么办</summary><p>检查网络后重试；仍不可用时联系服务提供方。</p></details></section>
</main></div>
<script>
(()=>{
const root=document.getElementById('ww-settings'),q=s=>root.querySelector(s),ids=['#st-model','#st-custommodel','#st-key','#st-endpoint','#st-length','#st-style','#st-instructions','#st-format','#st-locationchoice'];
const read=()=>ids.map(id=>q(id).value);let saved=read();
function update(){const dirty=JSON.stringify(read())!==JSON.stringify(saved);q('#st-save').disabled=!dirty;q('#st-discard').disabled=!dirty;q('#st-dirty').textContent=dirty?'有未保存修改':'设置已保存';q('#st-location').textContent=q('#st-locationchoice').value==='ask'?'每次导出时选择':'文档 / WeWriter（示例）';q('#st-customfield').hidden=q('#st-model').value!=='custom';q('#st-custommodel').required=q('#st-model').value==='custom';}
ids.forEach(id=>q(id).addEventListener('input',()=>{update();q('#st-feedback').textContent='';}));
q('#st-form').onsubmit=e=>{e.preventDefault();saved=read();q('#st-key').type='password';q('#st-keytoggle').textContent='显示';q('#st-keytoggle').setAttribute('aria-pressed','false');update();q('#st-feedback').textContent='已暂存到本次预览内存，未写入软件配置；新任务使用新设置。';};
q('#st-discard').onclick=()=>{ids.forEach((id,i)=>q(id).value=saved[i]);update();q('#st-feedback').textContent='已撤销未保存的修改。';};
q('#st-folder').onclick=()=>{q('#st-folderbox').hidden=!q('#st-folderbox').hidden;q('#st-folder').setAttribute('aria-expanded',!q('#st-folderbox').hidden);};
q('#st-check').onclick=()=>{q('#st-checkresult').hidden=false;q('#st-checkresult').textContent='当前为设计预览，未执行真实连接检查。';};
q('#st-keytoggle').onclick=()=>{const reveal=q('#st-key').type==='password';q('#st-key').type=reveal?'text':'password';q('#st-keytoggle').textContent=reveal?'隐藏':'显示';q('#st-keytoggle').setAttribute('aria-pressed',reveal);};
update();
})();
</script>
</div>
