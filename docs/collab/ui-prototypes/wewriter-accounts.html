<div id="ww-accounts">
<style>
#ww-accounts{--paper:light-dark(#fff,#20252d);--base:light-dark(#f4f6f8,#14181f);--ink:light-dark(#172638,#eef2f7);--muted:light-dark(#627183,#aab6c6);--line:light-dark(#dfe5ec,#38414d);--accent:light-dark(#225ac3,#98baff);--tint:light-dark(#edf3ff,#243859);--warn:light-dark(#925618,#edc788);color:var(--ink);font:14px/1.55 'Microsoft YaHei',sans-serif;background:var(--base);border-radius:14px;overflow:hidden;color-scheme:light dark}
#ww-accounts *{box-sizing:border-box}#ww-accounts [hidden]{display:none!important}#ww-accounts .top{background:var(--paper);border-bottom:1px solid var(--line);padding:14px 100px 14px 22px;display:flex;gap:14px;align-items:center}#ww-accounts .logo{font-size:18px;font-weight:600}#ww-accounts .sub{font-size:12px;color:var(--muted)}#ww-accounts .shell{display:grid;grid-template-columns:160px minmax(0,1fr)}#ww-accounts aside{padding:24px 14px;background:var(--paper);border-right:1px solid var(--line)}#ww-accounts .navitem{display:block;padding:11px 12px;margin-bottom:7px;border-radius:8px;color:var(--muted)}#ww-accounts .navitem.active{background:var(--tint);color:var(--accent);font-weight:600}#ww-accounts main{padding:26px;min-width:0}#ww-accounts h1{font-size:25px;margin:0;font-weight:600}#ww-accounts h2{font-size:16px;margin:0 0 12px}#ww-accounts .row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}#ww-accounts .heading{margin-bottom:22px}#ww-accounts button,#ww-accounts input{font:inherit;color:inherit}#ww-accounts button{position:relative;overflow:hidden;border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:7px 12px;transition:background .18s,transform .12s}#ww-accounts button:hover{background:var(--tint);border-color:var(--accent)}#ww-accounts button:active{transform:scale(.97)}#ww-accounts button.primary{background:var(--accent);color:light-dark(#fff,#14243f);border-color:var(--accent)}#ww-accounts input{min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:9px 12px}#ww-accounts .search{width:230px;max-width:100%}#ww-accounts .list{background:var(--paper);border:1px solid var(--line);border-radius:12px;margin-top:14px;padding:0 18px}#ww-accounts .account{display:grid;grid-template-columns:minmax(0,1fr) 105px 82px;gap:16px;align-items:center;padding:20px 0;border-bottom:1px solid var(--line)}#ww-accounts .account:last-child{border:0}#ww-accounts .name{font-weight:500;overflow-wrap:anywhere}#ww-accounts .state{font-size:12px;color:var(--muted);margin-top:4px}#ww-accounts .warning{color:var(--warn)}#ww-accounts .toggle{display:flex;align-items:center;gap:7px;white-space:nowrap;font-size:12px}#ww-accounts .toggle input{appearance:none;width:32px;height:19px;border:0;border-radius:14px;padding:0;background:var(--line);position:relative;transition:background .2s;flex-shrink:0}#ww-accounts .toggle input::after{content:'';position:absolute;left:3px;top:3px;width:13px;height:13px;border-radius:50%;background:var(--paper);transition:transform .2s}#ww-accounts .toggle input:checked{background:var(--accent)}#ww-accounts .toggle input:checked::after{transform:translateX(13px)}#ww-accounts .expand{grid-column:1/-1;padding:14px;background:var(--base);border-radius:7px}#ww-accounts .expand p{margin:0 0 9px}#ww-accounts .addbox{background:var(--paper);padding:18px;border:1px solid var(--line);border-radius:12px;margin-bottom:18px}#ww-accounts .addform{display:flex;align-items:end;gap:10px;flex-wrap:wrap}#ww-accounts .addform label{display:grid;gap:6px;flex:1;min-width:150px}#ww-accounts .actions{display:flex;gap:8px;flex-wrap:wrap}#ww-accounts .remove{color:var(--warn)}#ww-accounts .feedback{margin-top:10px;font-size:12px;color:var(--accent)}#ww-accounts .feedback:empty{display:none}#ww-accounts .confirm{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}#ww-accounts .empty{padding:35px 0;text-align:center;color:var(--muted)}#ww-accounts .wave{position:absolute;width:36px;height:36px;margin:-18px;border-radius:50%;background:currentColor;pointer-events:none;animation:wwa-wave .5s ease-out forwards}@keyframes wwa-wave{from{transform:scale(.1);opacity:.18}to{transform:scale(10);opacity:0}}@media(prefers-reduced-motion:reduce){#ww-accounts button,#ww-accounts .toggle input,#ww-accounts .toggle input::after{transition:none}#ww-accounts button:active{transform:none}#ww-accounts .wave{display:none}}@media(max-width:680px){#ww-accounts .shell{grid-template-columns:1fr}#ww-accounts aside{display:none}#ww-accounts main{padding:16px}#ww-accounts .account{grid-template-columns:minmax(0,1fr) auto;gap:12px}#ww-accounts .account>.namebox{grid-column:1/-1}#ww-accounts .account>button{justify-self:end}#ww-accounts .list{padding:0 14px}}@media(pointer:coarse){#ww-accounts button{min-height:44px}#ww-accounts .toggle{min-height:44px}#ww-accounts input[type=search],#ww-accounts input[type=text]{font-size:16px}}
</style>
<div class="top"><span class="logo">WeWriter</span><span class="sub">交互预览 · 示例数据</span></div>
<div class="shell"><aside aria-label="导航"><span class="navitem">工作台</span><span class="navitem active">公众号</span><span class="navitem">文章库</span><span class="navitem">稿件库</span><span class="navitem">设置</span></aside>
<main>
<div class="row heading"><h1>公众号</h1><div class="actions"><button id="wa-add" class="cursor-interaction" aria-expanded="false">手动添加</button><button id="wa-sync" class="primary cursor-interaction" aria-expanded="false">扫码同步书架</button></div></div>
<section class="addbox" id="wa-syncbox" hidden aria-label="同步微信读书书架">
<div class="row"><h2>同步微信读书书架</h2><button id="wa-syncclose" class="cursor-interaction">关闭</button></div>
<p class="sub">仅同步已加入微信读书书架的公众号。</p>
<div id="wa-scan"><div style="width:160px;max-width:100%;height:130px;display:grid;place-content:center;background:var(--base);border-radius:8px;margin:16px 0;text-align:center"><i data-lucide="scan-line" aria-hidden="true" style="margin:auto"></i><span class="sub">扫码区占位<br>预览不提供真实二维码</span></div><button id="wa-scanned" class="primary cursor-interaction">模拟扫码成功</button></div>
<div id="wa-pick" hidden><p id="wa-syncsummary" class="sub" role="status"></p><label class="toggle cursor-interaction"><input type="checkbox" id="wa-all" checked>全选新增公众号</label><div id="wa-candidates"></div><div class="actions" style="margin-top:14px"><button id="wa-import" class="primary cursor-interaction">导入所选</button></div></div>
</section>
<section class="addbox" id="wa-addbox" hidden aria-label="添加公众号"><h2>添加公众号</h2><form id="wa-form" class="addform"><label><span class="sub">公众号名称</span><input id="wa-name" type="text" placeholder="输入公众号名称" maxlength="60" required></label><button class="primary cursor-interaction" type="submit">添加</button><button class="cursor-interaction" id="wa-cancel" type="button">取消</button></form><p id="wa-error" role="alert" class="warning"></p><span class="sub">演示添加；正式版需先确认接口匹配的账号。</span></section>
<div class="row"><input id="wa-search" class="search" type="search" placeholder="搜索已添加的公众号" aria-label="搜索已添加的公众号"><span id="wa-count" class="sub"></span></div>
<div id="wa-feedback" class="feedback" role="status"></div><div id="wa-list" class="list"></div>
</main></div>
<script>
(()=>{
const root=document.getElementById('ww-accounts'),q=s=>root.querySelector(s);
let accounts=[{id:1,name:'示例公众号A',enabled:true,time:'10-25 09:15',state:'采集正常'},{id:2,name:'示例公众号B',enabled:true,time:'10-24 18:30',state:'上次采集失败',error:true},{id:3,name:'示例公众号C',enabled:true,time:'10-25 08:40',state:'采集正常'},{id:4,name:'示例公众号D',enabled:true,time:'10-25 07:20',state:'采集正常'},{id:5,name:'示例公众号E',enabled:false,time:'10-24 16:05',state:'采集正常'}],expanded=null,confirm=null,nextId=6;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){
const term=q('#wa-search').value.trim().toLowerCase(),visible=accounts.filter(a=>a.name.toLowerCase().includes(term));
q('#wa-count').textContent=accounts.length+' 个公众号 · '+accounts.filter(a=>a.enabled).length+' 个已启用';
q('#wa-list').innerHTML=visible.length?visible.map(a=>'<div class="account"><div class="namebox"><div class="name">'+esc(a.name)+'</div><div class="state '+(a.enabled&&a.error?'warning':'')+'">'+(a.enabled?esc(a.state):'已暂停采集')+'</div></div><label class="toggle cursor-interaction"><input type="checkbox" role="switch" data-toggle="'+a.id+'" '+(a.enabled?'checked':'')+' aria-label="启用 '+esc(a.name)+' 采集"><span>'+(a.enabled?'已启用':'已停用')+'</span></label><button class="cursor-interaction" data-detail="'+a.id+'" aria-expanded="'+(expanded===a.id)+'">'+(expanded===a.id?'收起':'详情')+'</button>'+(expanded===a.id?'<div class="expand"><p class="sub">最近返回文章：'+(a.time?esc(a.time)+'（中国时间）':'暂无记录')+'</p>'+(a.error?'<p class="warning">上次请求超时，已有文章保留。</p>':'')+'<button class="remove cursor-interaction" data-delete="'+a.id+'">删除公众号</button>'+(confirm===a.id?'<div class="confirm"><p>从采集名单移除？已有文章和稿件保留。</p><div class="actions"><button class="cursor-interaction" data-cancel="'+a.id+'">取消</button><button class="remove cursor-interaction" data-confirm="'+a.id+'">确认删除</button></div></div>':'')+'</div>':'')+'</div>').join(''):'<div class="empty">'+(accounts.length?'没有匹配的公众号':'还没有公众号，点击上方添加')+'</div>';
}
function closeAdd(){q('#wa-addbox').hidden=true;q('#wa-add').setAttribute('aria-expanded','false');q('#wa-add').focus();}
q('#wa-add').onclick=()=>{const box=q('#wa-addbox');box.hidden=!box.hidden;q('#wa-add').setAttribute('aria-expanded',!box.hidden);if(!box.hidden)q('#wa-name').focus();};
q('#wa-cancel').onclick=closeAdd;
const shelf=[{key:'demo-shelf-1',name:'示例公众号A'},{key:'demo-shelf-5',name:'示例公众号E'},{key:'demo-shelf-6',name:'工程观察（示例）'},{key:'demo-shelf-7',name:'建设资讯（示例）'}];
accounts.forEach(a=>a.shelfKey='demo-shelf-'+a.id);
function syncChoices(){const boxes=[...root.querySelectorAll('[data-pick]')],n=boxes.filter(b=>b.checked).length;q('#wa-import').textContent='导入所选（'+n+'）';q('#wa-import').disabled=n===0;q('#wa-all').checked=boxes.length>0&&n===boxes.length;q('#wa-all').indeterminate=n>0&&n<boxes.length;q('#wa-all').disabled=boxes.length===0;}
q('#wa-sync').onclick=()=>{q('#wa-addbox').hidden=true;q('#wa-add').setAttribute('aria-expanded','false');q('#wa-syncbox').hidden=false;q('#wa-sync').setAttribute('aria-expanded','true');q('#wa-scan').hidden=false;q('#wa-pick').hidden=true;q('#wa-scanned').focus();};
q('#wa-syncclose').onclick=()=>{q('#wa-syncbox').hidden=true;q('#wa-sync').setAttribute('aria-expanded','false');q('#wa-sync').focus();};
q('#wa-scanned').onclick=()=>{q('#wa-scan').hidden=true;q('#wa-pick').hidden=false;const fresh=shelf.filter(s=>!accounts.some(a=>a.shelfKey===s.key));q('#wa-syncsummary').textContent='发现 '+shelf.length+' 个公众号 · 新增 '+fresh.length+' 个 · 已有 '+(shelf.length-fresh.length)+' 个';q('#wa-candidates').innerHTML=shelf.map(s=>{const exists=accounts.some(a=>a.shelfKey===s.key);return '<label style="display:flex;align-items:center;gap:10px;padding:10px 0"><input type="checkbox" '+(exists?'disabled':'checked data-pick="'+s.key+'"')+'><span>'+esc(s.name)+'</span>'+(exists?'<span class="sub">已添加</span>':'')+'</label>';}).join('');syncChoices();q('#wa-all').focus();};
q('#wa-candidates').onchange=syncChoices;
q('#wa-all').onchange=e=>{root.querySelectorAll('[data-pick]').forEach(b=>b.checked=e.target.checked);syncChoices();};
q('#wa-import').onclick=()=>{let n=0;root.querySelectorAll('[data-pick]:checked').forEach(b=>{const s=shelf.find(s=>s.key===b.dataset.pick);if(!s||accounts.some(a=>a.shelfKey===s.key))return;accounts.push({id:nextId++,shelfKey:s.key,name:s.name,enabled:true,time:null,state:'尚未采集'});n++;});q('#wa-search').value='';render();q('#wa-syncbox').hidden=true;q('#wa-sync').setAttribute('aria-expanded','false');q('#wa-feedback').textContent='已导入 '+n+' 个公众号，已有账号及启停设置保持不变（演示）';q('#wa-sync').focus();};
q('#wa-search').oninput=render;
q('#wa-form').onsubmit=e=>{e.preventDefault();const name=q('#wa-name').value.trim();if(!name){q('#wa-error').textContent='请输入公众号名称';return;}if(accounts.some(a=>a.name.toLowerCase()===name.toLowerCase())){q('#wa-error').textContent='这个公众号已在列表中';return;}accounts.push({id:nextId++,name,enabled:true,time:null,state:'尚未采集'});q('#wa-search').value='';q('#wa-name').value='';q('#wa-error').textContent='';closeAdd();render();q('#wa-feedback').textContent='已添加 '+name+'（演示）';};
q('#wa-list').onchange=e=>{const id=Number(e.target.dataset.toggle),a=accounts.find(a=>a.id===id);if(!a)return;a.enabled=e.target.checked;render();q('[data-toggle="'+id+'"]').focus();q('#wa-feedback').textContent=a.name+(a.enabled?' 已启用':' 已停用')+'，下次任务生效';};
q('#wa-list').onclick=e=>{const b=e.target.closest('button');if(!b)return;let id;
if(b.dataset.detail){id=Number(b.dataset.detail);expanded=expanded===id?null:id;confirm=null;render();q('[data-detail="'+id+'"]').focus();}
else if(b.dataset.delete){id=Number(b.dataset.delete);confirm=id;render();q('[data-cancel="'+id+'"]').focus();}
else if(b.dataset.cancel){id=Number(b.dataset.cancel);confirm=null;render();q('[data-delete="'+id+'"]').focus();}
else if(b.dataset.confirm){id=Number(b.dataset.confirm);const a=accounts.find(a=>a.id===id);accounts=accounts.filter(a=>a.id!==id);expanded=null;confirm=null;render();q('#wa-feedback').textContent='已移除 '+a.name+'，已有文章和稿件保留';q('#wa-search').focus();}
};
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!b.isConnected)return;const r=b.getBoundingClientRect(),w=document.createElement('span');w.className='wave';w.setAttribute('aria-hidden','true');w.style.left=(e.detail?e.clientX-r.left:r.width/2)+'px';w.style.top=(e.detail?e.clientY-r.top:r.height/2)+'px';b.append(w);setTimeout(()=>w.remove(),550);});render();
})();
</script>
</div>
