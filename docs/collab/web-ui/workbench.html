<title>WeWriter 工作台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap">
<style>
/* Layout: fixed left rail + one reading column; the task pipeline is the one bold element. */
:root {
  --ground: #eef2f1;      /* desk */
  --sheet: #ffffff;       /* paper */
  --ink: #15232a;
  --ink-2: #56656d;
  --rule: #d9e1df;
  --jade: #0d6b5b;        /* accent: action and progress */
  --jade-soft: #e3f1ed;
  --cinnabar: #b9452f;    /* attention: needs a person */
  --cinnabar-soft: #f8e6e1;
  --amber: #8a5a12;
  --amber-soft: #f7efdc;
  --focus: #1f7a68;
  --glint: #8fe6d1;
  --glint-soft: rgb(255 255 255 / .55);
  --font-display: "Noto Serif SC", "Songti SC", "SimSun", serif;
  --font-body: "Noto Sans SC", "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0e1416; --sheet: #162024; --ink: #e6eeeb; --ink-2: #9cb0ab; --rule: #2a3a3e;
    --jade: #63c6ae; --jade-soft: #173a33; --cinnabar: #f08c74; --cinnabar-soft: #3d2520;
    --amber: #e8c27a; --amber-soft: #3a3020; --focus: #63c6ae; --glint: #e6fff8; --glint-soft: rgb(255 255 255 / .22); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #0e1416; --sheet: #162024; --ink: #e6eeeb; --ink-2: #9cb0ab; --rule: #2a3a3e;
  --jade: #63c6ae; --jade-soft: #173a33; --cinnabar: #f08c74; --cinnabar-soft: #3d2520;
  --amber: #e8c27a; --amber-soft: #3a3020; --focus: #63c6ae; --glint: #e6fff8; --glint-soft: rgb(255 255 255 / .22); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--ground); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.6; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.app { display: grid; grid-template-columns: 196px minmax(0, 1fr); min-height: 100%; }

/* Rail */
.rail { background: var(--sheet); border-right: 1px solid var(--rule); padding-block: 22px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; display: flex; flex-direction: column; gap: 28px; }
.brand { display: flex; flex-direction: column; gap: 2px; padding-left: 10px; }
.brand b { font-family: var(--font-display); font-size: 22px; letter-spacing: .02em; }
.brand span { color: var(--ink-2); font-size: 12px; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav button { all: unset; cursor: pointer; padding: 9px 12px; border-radius: 8px; color: var(--ink-2); display: flex; justify-content: space-between; align-items: center; }
.nav button:hover { background: var(--ground); color: var(--ink); }
.nav button[aria-current="page"] { background: var(--jade-soft); color: var(--jade); font-weight: 700; }
.nav small { font-size: 11px; color: var(--ink-2); font-weight: 400; }
.rail .foot { margin-top: auto; padding-left: 10px; color: var(--ink-2); font-size: 12px; }

/* Main column */
main { padding-block: 28px 48px; padding-left: 32px; padding-right: max(16px, env(safe-area-inset-right, 0px)); min-width: 0; }
.wrap { max-width: 980px; display: grid; gap: 18px; }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
h1 { font-family: var(--font-display); font-size: 30px; margin: 0; letter-spacing: .02em; }
.today { color: var(--ink-2); font-size: 13px; }
.sample { font-size: 12px; color: var(--amber); background: var(--amber-soft); padding: 2px 8px; border-radius: 999px; }

.panel { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius); padding: 20px 22px; min-width: 0; }
.panel h2 { font-size: 16px; margin: 0; font-weight: 700; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }

/* New task */
.new { display: flex; align-items: flex-end; gap: 22px; flex-wrap: wrap; }
.field { display: grid; gap: 6px; }
.field > span { font-size: 12px; color: var(--ink-2); }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.seg button { all: unset; cursor: pointer; padding: 7px 14px; border-right: 1px solid var(--rule); color: var(--ink-2); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--jade-soft); color: var(--jade); font-weight: 700; }
.seg.closed { border-color: var(--jade); }
.seg.closed button[aria-pressed="false"] { display: none; }
.seg.closed button[aria-pressed="true"] { font-size: 18px; padding: 6px 18px; display: inline-flex; align-items: center; border-right: 0; }
.seg button { text-align: center; justify-content: center; }
.count button { box-sizing: content-box; width: 1.4em; }
.count.closed button[aria-pressed="true"] { width: 2.2em; padding: 6px 12px; }
.seg.closed:hover { box-shadow: 0 0 0 3px var(--jade-soft); }
.seg:not(.closed) button { animation: pop .16s ease-out; }
@keyframes pop { from { opacity: 0; transform: translateY(-2px); } to { opacity: 1; transform: none; } }
.seg button:focus-visible { outline-offset: -2px; }
.count button { min-width: 18px; text-align: center; font-variant-numeric: tabular-nums; }
.scope { color: var(--ink-2); font-size: 13px; padding-bottom: 8px; }
.scope b { color: var(--ink); font-weight: 500; }
.btn { cursor: pointer; border: 1px solid var(--rule); background: var(--sheet); border-radius: 8px; padding: 7px 14px; }
.btn:hover { border-color: var(--ink-2); }
.btn:disabled { cursor: not-allowed; opacity: .5; }
.btn.primary { background: var(--jade); border-color: var(--jade); color: var(--sheet); font-weight: 700; padding: 8px 20px; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.quiet { border-color: transparent; color: var(--ink-2); }
.btn.quiet:hover { color: var(--ink); border-color: var(--rule); }
.btn.danger { color: var(--cinnabar); }
.queue { font-size: 12px; color: var(--amber); padding-bottom: 9px; }

/* Current task */
.chip { font-size: 12px; padding: 2px 10px; border-radius: 999px; background: var(--ground); color: var(--ink-2); white-space: nowrap; }
.chip.run { background: var(--jade-soft); color: var(--jade); }
.chip.done { background: var(--jade-soft); color: var(--jade); }
.chip.stop { background: var(--amber-soft); color: var(--amber); }
.chip.fail { background: var(--cinnabar-soft); color: var(--cinnabar); }
.chip.wait { background: var(--cinnabar-soft); color: var(--cinnabar); }
.summary { font-family: var(--font-display); font-size: 24px; margin: 2px 0 2px; text-wrap: balance; }
.summary em { font-style: normal; color: var(--cinnabar); }
.meta { color: var(--ink-2); font-size: 13px; font-variant-numeric: tabular-nums; }
.pipe { list-style: none; padding: 0; margin: 18px 0 6px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.pipe li { display: grid; gap: 8px; cursor: pointer; }
.pipe .bar { height: 4px; border-radius: 4px; background: var(--rule); position: relative; overflow: hidden; }
.pipe li.done .bar { background: var(--jade); }
.pipe li.now .bar { background: var(--jade-soft); }
.pipe li.now .bar::after { content: ""; position: absolute; inset: 0; width: 40%; background: linear-gradient(90deg, transparent, var(--jade), transparent); animation: run 1.6s linear infinite; }
@keyframes run { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
.pipe .name { font-size: 13px; color: var(--ink-2); display: flex; gap: 6px; align-items: baseline; }
.pipe .name i { font-style: normal; font-variant-numeric: tabular-nums; font-size: 12px; }
.pipe li.done .name { color: var(--ink); }
.pipe li.now .name { font-weight: 700; }
/* Shimmer: everything in progress right now carries the same moving light. */
.shine { background: linear-gradient(100deg, var(--jade) 0%, var(--jade) 38%, var(--glint) 50%, var(--jade) 62%, var(--jade) 100%);
  background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: glint 1.8s linear infinite; }
@keyframes glint { from { background-position: 125% 0; } to { background-position: -125% 0; } }
.pipe li.now .bar { height: 6px; margin-top: -1px; }
.chip.run { position: relative; overflow: hidden; }
.chip.run::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, var(--glint-soft) 50%, transparent 70%); background-size: 250% 100%; animation: glint 1.8s linear infinite; }
.drafts li.pending { position: relative; }
.drafts li.pending .t { background: linear-gradient(100deg, var(--ink-2) 0%, var(--ink-2) 38%, var(--glint) 50%, var(--ink-2) 62%, var(--ink-2) 100%); background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: glint 1.8s linear infinite; }
.drafts li.pending::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: linear-gradient(90deg, transparent, var(--jade), transparent) no-repeat; background-size: 40% 100%; animation: sweep 1.8s linear infinite; }
@keyframes sweep { from { background-position: -60% 0; } to { background-position: 160% 0; } }
.panel.running { border-color: var(--jade); box-shadow: 0 0 0 3px var(--jade-soft); }
.pipe li.person .name { color: var(--cinnabar); font-weight: 700; }
.pipe li.person .bar { background: var(--cinnabar); }
.live { font-size: 13px; color: var(--ink-2); min-height: 1.6em; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; align-items: center; }
.confirm { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--amber-soft); color: var(--amber); padding: 10px 12px; border-radius: 8px; margin-top: 12px; font-size: 13px; }
.confirm .btn { background: var(--sheet); }

/* Drafts */
.drafts { list-style: none; margin: 0; padding: 0; }
.drafts li { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--rule); }
.drafts li:first-child { border-top: 0; padding-top: 2px; }
.drafts .n { color: var(--ink-2); font-variant-numeric: tabular-nums; font-size: 13px; }
.drafts .t { font-weight: 500; overflow-wrap: anywhere; }
.drafts .s { font-size: 12px; color: var(--ink-2); display: flex; gap: 10px; flex-wrap: wrap; }
.drafts .s .wait { color: var(--cinnabar); }
.drafts .s .ok { color: var(--jade); }
.drafts .s .flag { color: var(--amber); }
.empty { color: var(--ink-2); font-size: 13px; padding: 6px 0; }

/* History */
.hist { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.hist td { padding: 10px 0; border-top: 1px solid var(--rule); vertical-align: middle; }
.hist tr:first-child td { border-top: 0; }
.hist td:nth-child(3) { color: var(--ink-2); font-size: 13px; }
.hist td:last-child { text-align: right; }
.scroll-x { overflow-x: auto; }
.pager { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; color: var(--ink-2); font-size: 12px; }
.pager div { display: flex; gap: 8px; }

/* Detail drawer */
.drawer { position: fixed; inset: 0 0 0 auto; width: min(520px, 100%); background: var(--sheet); border-left: 1px solid var(--rule); padding: 22px 24px calc(24px + env(safe-area-inset-bottom, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); overflow-y: auto; box-shadow: -18px 0 40px rgb(0 0 0 / .12); z-index: 20; }
.drawer h3 { font-family: var(--font-display); font-size: 20px; margin: 0 0 4px; }
.drawer h4 { font-size: 13px; color: var(--ink-2); font-weight: 500; margin: 22px 0 10px; }
.steps { list-style: none; padding: 0; margin: 0; display: grid; gap: 0; counter-reset: s; }
.steps > li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; position: relative; padding-bottom: 16px; }
.steps > li:not(:last-child)::before { content: ""; position: absolute; left: 13px; top: 26px; bottom: 2px; width: 2px; background: var(--rule); }
.steps .no { width: 28px; height: 28px; border-radius: 50%; background: var(--jade-soft); color: var(--jade); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.steps p { margin: 3px 0 0; font-size: 14px; }
.steps p b { font-size: 18px; font-variant-numeric: tabular-nums; margin: 0 2px; }
.steps small { display: block; color: var(--ink-2); font-size: 12px; margin-top: 2px; }
.picked { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.picked li { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; background: var(--ground); padding: 7px 10px; border-radius: 6px; }
.picked span:last-child { color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.alert { background: var(--cinnabar-soft); color: var(--cinnabar); padding: 9px 12px; border-radius: 8px; font-size: 13px; }
.accts { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.accts th { text-align: left; color: var(--ink-2); font-weight: 500; padding: 0 0 6px; }
.accts td { padding: 6px 0; border-top: 1px solid var(--rule); }
.accts .bad { color: var(--cinnabar); }
.choice { display: grid; gap: 10px; margin-top: 22px; }
.choice div { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; }
.choice small { color: var(--ink-2); font-size: 12px; }
.note { font-size: 13px; color: var(--ink-2); }
.drawer dl { display: grid; grid-template-columns: 7em minmax(0, 1fr); gap: 6px 12px; font-size: 13px; margin: 0; }
.drawer dt { color: var(--ink-2); }
.drawer dd { margin: 0; overflow-wrap: anywhere; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--sheet); padding: 8px 16px; border-radius: 8px; font-size: 13px; z-index: 30; }

@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { flex-direction: row; align-items: center; padding-block: 10px; border-right: 0; border-bottom: 1px solid var(--rule); gap: 14px; overflow-x: auto; }
  .brand span, .rail .foot { display: none; }
  .nav { flex-direction: row; }
  .nav small { display: none; }
  main { padding-left: max(16px, env(safe-area-inset-left, 0px)); }
  .pipe { grid-template-columns: repeat(5, minmax(52px, 1fr)); }
  .summary { font-size: 20px; }
}
@media (prefers-reduced-motion: reduce) {
  .seg:not(.closed) button { animation: none; }
  .pipe li.now .bar::after { animation: none; width: 100%; opacity: .5; }
  .shine, .drafts li.pending .t { animation: none; color: var(--jade); background: none; }
  .chip.run::after, .drafts li.pending::after { animation: none; display: none; }
}
</style>

<div class="app">
  <aside class="rail">
    <div class="brand"><b>WeWriter</b><span>公众号内容工作台</span></div>
    <nav class="nav" aria-label="页面">
      <button aria-current="page">工作台</button>
      <button data-later>公众号<small>下一页</small></button>
      <button data-later>文章库<small>待交付</small></button>
      <button data-later>稿件库<small>待交付</small></button>
      <button data-later>设置<small>待交付</small></button>
    </nav>
    <div class="foot">v0.10.4 · 试用页面</div>
  </aside>

  <main>
    <div class="wrap">
      <div class="top">
        <h1>工作台</h1>
        <div class="today"><span id="clock"></span> 中国时间 · <span class="sample">示例数据，可点击试用</span></div>
      </div>

      <section class="panel" aria-labelledby="new-h">
        <div class="panel-head"><h2 id="new-h">新建任务</h2></div>
        <div class="new">
          <div class="field"><span id="range-l">文章范围</span>
            <div class="seg closed" role="group" aria-labelledby="range-l" id="range">
              <button aria-pressed="true" data-v="今天">今天</button>
              <button aria-pressed="false" data-v="近 24 小时">近 24 小时</button>
              <button aria-pressed="false" data-v="近 3 天">近 3 天</button>
            </div>
          </div>
          <div class="field"><span id="count-l">生成篇数</span>
            <div class="seg count closed" role="group" aria-labelledby="count-l" id="count">
              <button aria-pressed="false" data-v="1">1</button>
              <button aria-pressed="true" data-v="2">2</button>
              <button aria-pressed="false" data-v="3">3</button>
              <button aria-pressed="false" data-v="4">4</button>
              <button aria-pressed="false" data-v="5">5</button>
            </div>
          </div>
          <div class="scope"><b>4</b> 个公众号已启用 · 按阅读量选文</div>
          <button class="btn primary" id="start">开始任务</button>
          <div class="queue" id="queue" hidden></div>
        </div>
      </section>

      <section class="panel" aria-labelledby="cur-h" id="curpanel">
        <div class="panel-head">
          <h2 id="cur-h">当前任务</h2>
          <span class="chip" id="state">已完成</span>
        </div>
        <p class="summary" id="summary"></p>
        <div class="meta" id="meta"></div>
        <ol class="pipe" id="pipe" aria-label="任务进度"></ol>
        <div class="live" id="live" aria-live="polite"></div>
        <div class="actions">
          <button class="btn" id="detail">查看详情</button>
          <button class="btn danger" id="stop">停止任务</button>
          <button class="btn quiet" id="cancelq" hidden>取消排队</button>
        </div>
        <div class="confirm" id="confirm" hidden>
          停止后保留已有稿件；已发出的请求会在返回后结束，排队任务不会自动开始。
          <button class="btn" id="stop-yes">确认停止</button>
          <button class="btn quiet" id="stop-no">继续运行</button>
        </div>
      </section>

      <section class="panel" aria-labelledby="dr-h">
        <div class="panel-head"><h2 id="dr-h">本次稿件</h2><span class="meta" id="passed"></span></div>
        <ol class="drafts" id="drafts"></ol>
      </section>

      <section class="panel" aria-labelledby="hi-h">
        <div class="panel-head">
          <h2 id="hi-h">历史任务</h2>
          <button class="btn quiet" id="histtoggle" aria-expanded="false" aria-controls="hist">展开</button>
        </div>
        <div id="hist" hidden>
          <div class="scroll-x"><table class="hist"><tbody id="histbody"></tbody></table></div>
          <div class="pager"><span id="pageinfo"></span><div><button class="btn" id="prev">上一页</button><button class="btn" id="next">下一页</button></div></div>
        </div>
        <div class="note" id="histnote">每页 5 条 · 只有人工审核通过的稿件计入合格</div>
      </section>
    </div>
  </main>
</div>

<aside class="drawer" id="drawer" hidden aria-labelledby="dw-h">
  <div class="panel-head" style="margin-bottom:4px"><h3 id="dw-h">任务详情</h3><button class="btn quiet" id="dw-close">关闭</button></div>
  <div class="note" id="dw-sub"></div>
  <div id="dw-body"></div>
  <div class="choice" id="dw-actions"></div>
</aside>
<div class="toast" id="toast" hidden></div>

<script>
const $ = id => document.getElementById(id);
const STEPS = ['采集', '预检', '写作', '二审', '待审核'];
const PER = 5;   // history rows per page
const STAGE_TEXT = ['正在读取 4 个公众号的文章列表…', '正在提取正文、检查图片型文章…', '正在联网查资料并逐篇写作…', '正在对照原文做二审…', '稿件已生成，等你审核'];
const TITLES = ['行业变化如何影响项目决策', '企业面对新政策应先确认什么', '专精特新申报前要准备的三份材料',
                '城市更新项目的咨询机会在哪里', '中央预算内投资专项怎么申报'];
const pad = n => String(n).padStart(2, '0');
function cnNow() { const d = new Date(Date.now() + (new Date().getTimezoneOffset() + 480) * 60000); return d; }
function stamp(d) { return `${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }

const state = {
  range: '今天', count: 2, queue: [],
  // Opens on a running task so the in-progress state is visible at once.
  task: { range: '今天', count: 2, step: 2, running: true, started: Date.now() - 252000, ended: 0,
          drafts: [{ t: TITLES[0], s: '待审核', flag: '1 处引语待核实' }], stopped: false },
  history: Array.from({ length: 14 }, (_, i) => {
    const d = cnNow(); d.setHours(d.getHours() - 7 * (i + 1));
    const target = [2, 3, 2, 1, 5][i % 5];
    const status = ['已完成', '部分完成', '已完成', '失败', '已停止'][i % 5];
    const ok = status === '失败' ? 0 : status === '部分完成' ? target - 1 : Math.max(0, target - (i % 2));
    return { when: stamp(d), status, ok, target };
  }),
  page: 0, timer: null,
};

function pick(groupId, key, cast = v => v) {
  const group = $(groupId);
  const sync = () => {
    for (const x of group.children) {
      const chosen = x.getAttribute('aria-pressed') === 'true';
      x.setAttribute('aria-expanded', String(!group.classList.contains('closed')));
      x.title = chosen && group.classList.contains('closed') ? '点击选择其他选项' : '';
    }
  };
  group.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (group.classList.contains('closed')) {          // open: show every option
      group.classList.remove('closed'); sync(); b.focus(); return;
    }
    state[key] = cast(b.dataset.v);                    // choose, then fold back to the choice
    for (const x of group.children) x.setAttribute('aria-pressed', String(x === b));
    group.classList.add('closed'); sync(); b.focus();
  });
  group.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !group.classList.contains('closed')) {
      group.classList.add('closed'); sync(); group.querySelector('[aria-pressed="true"]').focus();
    }
  });
  document.addEventListener('click', e => {           // clicking elsewhere folds it back
    if (!group.contains(e.target) && !group.classList.contains('closed')) { group.classList.add('closed'); sync(); }
  });
  sync();
}
pick('range', 'range'); pick('count', 'count', Number);

function toast(text) {
  const t = $('toast'); t.textContent = text; t.hidden = false;
  clearTimeout(toast.h); toast.h = setTimeout(() => { t.hidden = true; }, 2600);
}

function elapsed(task) {
  const s = Math.max(0, Math.round(((task.running ? Date.now() : task.ended) - task.started) / 1000));
  return s >= 3600 ? `${Math.floor(s / 3600)} 小时 ${Math.floor(s % 3600 / 60)} 分` : `${Math.floor(s / 60)} 分 ${pad(s % 60)} 秒`;
}

function render() {
  const t = state.task;
  const waiting = t.drafts.filter(d => d.s === '待审核').length;
  const passed = t.drafts.filter(d => d.s === '已通过').length;
  const working = t.running ? Math.max(0, t.count - t.drafts.length) : 0;
  const parts = [];
  if (waiting) parts.push(`<em>${waiting} 篇待审核</em>`);
  if (working) parts.push(`${working} 篇处理中`);
  if (passed) parts.push(`${passed} 篇已通过`);
  $('summary').innerHTML = parts.join('，') || (t.stopped ? '任务已停止，未生成稿件' : '还没有完成的稿件');
  $('meta').textContent = `${t.range} · 目标 ${t.count} 篇 · 已用时 ${elapsed(t)}`;
  const chip = $('state');
  chip.className = 'chip ' + (t.running ? 'run' : t.stopped ? 'stop' : waiting ? 'wait' : 'done');
  chip.textContent = t.running ? '生成中' : t.stopped ? '已停止' : waiting ? '等你审核' : '已完成';
  $('pipe').innerHTML = STEPS.map((name, i) => {
    let cls = i < t.step ? 'done' : i === t.step ? (t.running ? 'now' : '') : '';
    if (!t.running && i === 4 && t.step >= 4 && waiting) cls = 'person';
    if (!t.running && i === 4 && t.step >= 4 && !waiting) cls = 'done';
    const mark = cls === 'done' ? '✓' : String(i + 1);
    return `<li class="${cls}" title="查看阶段实况"><span class="bar"></span><span class="name ${cls === 'now' ? 'shine' : ''}"><i>${mark}</i>${name}${cls === 'now' ? '中' : ''}</span></li>`;
  }).join('');
  $('live').textContent = t.running ? STAGE_TEXT[t.step] : t.stopped ? '已在“写作”阶段停止，已生成的稿件保留。' : '';
  $('live').className = 'live' + (t.running ? ' shine' : '');
  $('curpanel').classList.toggle('running', t.running);
  $('stop').hidden = !t.running;
  $('start').textContent = t.running ? '加入队列' : '开始任务';
  $('queue').hidden = !state.queue.length;
  $('queue').textContent = `排队 ${state.queue.length} 个，前一个完成后自动开始`;
  $('cancelq').hidden = !state.queue.length;
  $('passed').textContent = t.drafts.length ? `人工通过 ${passed} / ${t.count}` : '';
  const slots = t.drafts.map(d => d);
  if (t.running) for (let i = t.drafts.length; i < t.count; i++) slots.push({ t: '写作中…', s: '处理中', pending: true });
  $('drafts').innerHTML = slots.length ? slots.map((d, i) => `
    <li class="${d.pending ? 'pending' : ''}"><span class="n">${pad(i + 1)}</span>
      <div><div class="t">${d.t}</div><div class="s"><span class="${d.s === '待审核' ? 'wait' : d.s === '已通过' ? 'ok' : ''}">${d.s}</span>${d.flag ? `<span class="flag">${d.flag}</span>` : ''}</div></div>
      <button class="btn" ${d.pending ? 'disabled' : ''} data-open="${i}">查看稿件</button></li>`).join('')
    : `<li class="empty">稿件会在这里逐篇出现，单篇写完即可查看。</li>`;
  renderHistory();
}

function renderHistory() {
  const rows = state.history.slice(state.page * PER, state.page * PER + PER);
  $('histbody').innerHTML = rows.map((h, i) => `
    <tr><td>${h.when}</td><td><span class="chip ${h.status === '已完成' ? 'done' : h.status === '失败' ? 'fail' : 'stop'}">${h.status}</span></td>
    <td>合格稿件 ${h.ok} / ${h.target}</td><td><button class="btn quiet" data-hist="${state.page * PER + i}">详情</button></td></tr>`).join('');
  const pages = Math.ceil(state.history.length / PER);
  $('pageinfo').textContent = `共 ${state.history.length} 条 · 第 ${state.page + 1}/${pages} 页`;
  $('prev').disabled = state.page === 0; $('next').disabled = state.page >= pages - 1;
}

function startTask(range, count) {
  const t = state.task;
  if (t.running) return;
  if (t.drafts.length || t.stopped) {
    const ok = t.drafts.filter(d => d.s === '已通过').length;
    state.history.unshift({ when: stamp(cnNow()), status: t.stopped ? '已停止' : '已完成', ok, target: t.count });
  }
  state.task = { range, count, step: 0, running: true, started: Date.now(), ended: 0, drafts: [], stopped: false };
  tick();
}

function tick() {
  clearTimeout(state.timer);
  const t = state.task;
  if (!t.running) return;
  state.timer = setTimeout(() => {
    if (t.step < 2) t.step += 1;
    else if (t.step === 2) {
      if (t.drafts.length < t.count) t.drafts.push({ t: TITLES[t.drafts.length % TITLES.length], s: '待审核',
                                                    flag: t.drafts.length === 0 ? '1 处引语待核实' : '' });
      if (t.drafts.length >= t.count) t.step = 3;
    } else if (t.step === 3) { t.step = 4; t.running = false; t.ended = Date.now(); toast(`${t.count} 篇稿件已生成，等你审核`); nextInQueue(); }
    render(); tick();
  }, t.step === 2 ? 2200 : 1800);
}

function nextInQueue() {
  const next = state.queue.shift();
  if (next) setTimeout(() => { startTask(next.range, next.count); toast('排队任务已开始'); render(); }, 900);
}

$('start').addEventListener('click', () => {
  if (state.task.running) {
    state.queue.push({ range: state.range, count: state.count });
    toast(`已加入队列：${state.range} · ${state.count} 篇（设置已冻结）`);
  } else startTask(state.range, state.count);
  render();
});
$('stop').addEventListener('click', () => { $('confirm').hidden = false; $('stop-yes').focus(); });
$('stop-no').addEventListener('click', () => { $('confirm').hidden = true; });
$('stop-yes').addEventListener('click', () => {
  const t = state.task; t.running = false; t.stopped = true; t.ended = Date.now();
  clearTimeout(state.timer); $('confirm').hidden = true; toast('任务已停止，稿件已保留'); render();
});
$('cancelq').addEventListener('click', () => { const n = state.queue.length; state.queue = []; toast(`已取消 ${n} 个排队任务`); render(); });
$('histtoggle').addEventListener('click', e => {
  const open = $('hist').hidden; $('hist').hidden = !open;
  e.target.textContent = open ? '收起' : '展开'; e.target.setAttribute('aria-expanded', String(open));
  $('histnote').hidden = open;
});
$('prev').addEventListener('click', () => { state.page--; renderHistory(); });
$('next').addEventListener('click', () => { state.page++; renderHistory(); });
document.querySelectorAll('[data-later]').forEach(b => b.addEventListener('click', () => toast(`“${b.firstChild.textContent.trim()}”页会在后续逐页交付`)));
$('drafts').addEventListener('click', e => { const b = e.target.closest('[data-open]'); if (b) toast('稿件库页交付后，这里会直接打开这篇稿件'); });

function openDrawer(title, sub, body, actions) {
  $('dw-h').textContent = title; $('dw-sub').textContent = sub;
  $('dw-body').innerHTML = body;
  $('dw-actions').innerHTML = actions.map(([label, hint, cls]) =>
    `<div><button class="btn ${cls || ''}">${label}</button><small>${hint}</small></div>`).join('');
  $('drawer').hidden = false; $('dw-close').focus();
}
$('dw-close').addEventListener('click', () => { $('drawer').hidden = true; });
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('drawer').hidden = true; });
$('dw-actions').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { toast(b.textContent + '（示例）'); $('drawer').hidden = true; } });

const ACCOUNTS = [['惠企策论', 15, '10-25 09:15'], ['中企讯重大投资项目资讯', 15, '10-25 04:00'],
                  ['悠米一下', 10, '10-21 21:56'], ['咨询日记', 6, '10-24 23:40']];
function howChosen(range, count, picked, failed) {
  const list = picked.map(([t, r]) => `<li><span>${t}</span><span>阅读 ${r.toLocaleString()}</span></li>`).join('');
  return `
    <h4>这次是怎么选出文章的</h4>
    <ol class="steps">
      <li><span class="no">1</span><div><p>从 ${ACCOUNTS.length} 个公众号读到<b>46</b>篇文章</p><small>来源：极致了${failed ? '；1 个公众号读取失败，见下表' : '，4 个公众号都读取成功'}</small></div></li>
      <li><span class="no">2</span><div><p>其中<b>12</b>篇发布于“${range}”</p><small>其余 34 篇发布时间更早，不参与本次选文</small></div></li>
      <li><span class="no">3</span><div><p>去掉不能用的 3 篇，剩<b>9</b>篇可选</p><small>已经写过稿件的 2 篇；以图片为主、文字不足的 1 篇</small></div></li>
      <li><span class="no">4</span><div><p>按阅读量从高到低，选前<b>${count}</b>篇来写</p><ul class="picked">${list}</ul></div></li>
    </ol>
    <h4>各公众号读取情况</h4>
    <div class="scroll-x"><table class="accts"><thead><tr><th>公众号</th><th>读到</th><th>最近一篇</th></tr></thead><tbody>
      ${ACCOUNTS.map(([n, c, w], i) => failed && i === 3
        ? `<tr><td>${n}</td><td class="bad" colspan="2">读取失败：采集服务繁忙，未扣费</td></tr>`
        : `<tr><td>${n}</td><td>${c} 篇</td><td>${w}</td></tr>`).join('')}
    </tbody></table></div>`;
}

function taskDetail() {
  const t = state.task;
  const picked = TITLES.slice(0, t.count).map((title, i) => [title, 4904 - i * 1210]);
  const flag = t.drafts.some(d => d.flag) ? '<h4>需要你注意</h4><div class="alert">第 1 篇有 1 处引语和原文对不上，审核时请核对。</div>' : '';
  openDrawer('当前任务详情', `${t.range} · 目标 ${t.count} 篇 · ${t.running ? '正在' + STEPS[t.step] : '已结束'}`,
    flag + howChosen(t.range, t.count, picked, false),
    t.running ? [] : [['继续原任务', '沿用当时的设置和选好的文章，只补完没写完的稿件'],
                      ['重新采集', '用现在的设置重新读取文章，新建一个任务', 'primary']]);
}
$('detail').addEventListener('click', taskDetail);
$('pipe').addEventListener('click', taskDetail);
$('histbody').addEventListener('click', e => {
  const b = e.target.closest('[data-hist]'); if (!b) return;
  const h = state.history[Number(b.dataset.hist)];
  const picked = TITLES.slice(0, h.target).map((title, i) => [title, 3820 - i * 640]);
  const why = h.status === '失败' ? '<h4>为什么失败</h4><div class="alert">采集服务当时繁忙，没有读到文章，也没有扣费。稍后点“继续原任务”即可。</div>'
            : h.status === '已停止' ? '<h4>为什么没写完</h4><div class="alert">你在写作阶段手动停止了任务，已写好的稿件都保留着。</div>' : '';
  openDrawer(`任务 · ${h.when}`, `${h.status} · 人工通过 ${h.ok} / ${h.target} 篇`,
    why + howChosen('今天', h.target, picked, h.status === '失败'),
    h.status === '已完成' ? [['重新采集', '用现在的设置重新读取文章，新建一个任务', 'primary']]
      : [['继续原任务', '沿用当时的设置和选好的文章，只补完没写完的稿件', 'primary'],
         ['重新采集', '用现在的设置重新读取文章，新建一个任务']]);
});

setInterval(() => { $('clock').textContent = stamp(cnNow()); if (state.task.running) $('meta').textContent = `${state.task.range} · 目标 ${state.task.count} 篇 · 已用时 ${elapsed(state.task)}`; }, 1000);
$('clock').textContent = stamp(cnNow());
render();
tick();
</script>
